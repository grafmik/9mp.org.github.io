<body>
<div id="wrap"><canvas id="game" width="540" height="810"></canvas></div>
<script>
/* ==================================================================
   NEON BLASTER // OVERDRIVE
   Shoot'em up vertical — un seul fichier, zéro dépendance.
   Audio, musique, ennemis, boss et effets sont générés à la volée.
   ================================================================== */
'use strict';

/* ---------------------------------------------------------------
   0. CONSTANTES & OUTILS
   --------------------------------------------------------------- */
const VW = 540, VH = 810;              // résolution logique du jeu
const STEP = 1000 / 60;                // pas de simulation fixe
const TAU = Math.PI * 2;
const FONT = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const rnd   = (min, max) => min + Math.random() * (max - min);
const rndi  = (min, max) => (min + Math.random() * (max - min + 1)) | 0;
const pick  = arr => arr[(Math.random() * arr.length) | 0];
const rsign = () => Math.random() < 0.5 ? -1 : 1;
const dist2 = (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay);
const aim   = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const approach = (v, t, s) => v < t ? Math.min(v + s, t) : Math.max(v - s, t);

/* ---------------------------------------------------------------
   1. CANVAS — scène hors-écran composée dans le canvas visible
   --------------------------------------------------------------- */
const view = document.getElementById('game');
const vctx = view.getContext('2d', { alpha:false });
const scene = document.createElement('canvas');
const ctx = scene.getContext('2d', { alpha:false });
let DPR = 1, viewScale = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const availW = window.innerWidth - 10;
  const availH = window.innerHeight - 10;
  viewScale = Math.min(availW / VW, availH / VH);
  view.width  = Math.round(VW * DPR);
  view.height = Math.round(VH * DPR);
  scene.width = view.width;
  scene.height = view.height;
  view.style.width  = Math.round(VW * viewScale) + 'px';
  view.style.height = Math.round(VH * viewScale) + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  vctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

/* ---- halos pré-rendus (bien plus rapide que createRadialGradient / frame) ---- */
const glowCache = new Map();
function hexRgb(hex){
  if(hex[0] !== '#') return hex;
  if(hex.length === 4) hex = '#' + hex[1]+hex[1] + hex[2]+hex[2] + hex[3]+hex[3];
  return parseInt(hex.slice(1,3),16) + ',' + parseInt(hex.slice(3,5),16) + ',' + parseInt(hex.slice(5,7),16);
}
function glowSprite(hex){
  let c = glowCache.get(hex);
  if(c) return c;
  const S = 128;
  c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const rgb = hexRgb(hex);
  const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grd.addColorStop(0,    'rgba(' + rgb + ',1)');
  grd.addColorStop(0.18, 'rgba(' + rgb + ',0.62)');
  grd.addColorStop(0.42, 'rgba(' + rgb + ',0.22)');
  grd.addColorStop(0.72, 'rgba(' + rgb + ',0.05)');
  grd.addColorStop(1,    'rgba(' + rgb + ',0)');
  g.fillStyle = grd; g.fillRect(0,0,S,S);
  glowCache.set(hex, c);
  return c;
}
function glow(x, y, r, hex, alpha){
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(glowSprite(hex), x - r, y - r, r*2, r*2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
function shade(hex, amt){
  const p = hexRgb(hex).split(',').map(n => clamp((+n) + amt, 0, 255) | 0);
  return 'rgb(' + p[0] + ',' + p[1] + ',' + p[2] + ')';
}
function rgba(hex, a){ return 'rgba(' + hexRgb(hex) + ',' + a + ')'; }

function txt(s, x, y, size, color, align, weight, blur){
  ctx.font = (weight || 'bold') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if(blur){ ctx.shadowColor = color; ctx.shadowBlur = blur; }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
  ctx.shadowBlur = 0;
}
/* texte "arcade" avec espacement des lettres */
function txtWide(s, x, y, size, color, spacing, blur){
  ctx.font = 'bold ' + size + 'px ' + FONT;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  let total = 0;
  for(const ch of s) total += ctx.measureText(ch).width + spacing;
  total -= spacing;
  let cx = x - total/2;
  if(blur){ ctx.shadowColor = color; ctx.shadowBlur = blur; }
  ctx.fillStyle = color;
  for(const ch of s){
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + spacing;
  }
  ctx.shadowBlur = 0;
}
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------------------------------------------------------------
   2. EFFETS D'ÉCRAN & MINUTERIES
   --------------------------------------------------------------- */
let shakeMag = 0, shakeX = 0, shakeY = 0;
let flashA = 0, flashCol = '#ffffff';
let hitStop = 0, timeScale = 1, timeScaleT = 0, scaleAcc = 0;
let chroma = 0;

const shake  = m => { if(m > shakeMag) shakeMag = m; };
const flash  = (c, a) => { flashCol = c; if(a > flashA) flashA = a; };
const freeze = f => { if(f > hitStop) hitStop = f; };
const slowmo = (s, f) => { timeScale = s; timeScaleT = f; };

let timers = [];
function after(frames, fn){ timers.push({ t: frames, fn: fn }); }
function updateTimers(){
  for(let i = timers.length - 1; i >= 0; i--){
    if(--timers[i].t <= 0){ const fn = timers[i].fn; timers.splice(i,1); fn(); }
  }
}

/* ---------------------------------------------------------------
   3. ENTRÉES — clavier, souris, tactile
   --------------------------------------------------------------- */
const keys = Object.create(null);
const BLOCK = new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','KeyB','KeyX','KeyP','KeyM','KeyF','KeyH']);
let bombReq = false, confirmReq = false, autofire = true, touchMode = false;

window.addEventListener('keydown', e => {
  SND.unlock();
  if(BLOCK.has(e.code)) e.preventDefault();
  if(e.repeat) return;
  keys[e.code] = true;
  switch(e.code){
    case 'KeyB': case 'KeyX': bombReq = true; break;
    case 'Space': case 'Enter': case 'NumpadEnter': confirmReq = true; break;
    case 'KeyP': case 'Escape': togglePause(); break;
    case 'KeyM': SND.toggleMute(); break;
    case 'KeyH': autofire = !autofire; toast(autofire ? 'TIR AUTO : ON' : 'TIR AUTO : OFF'); break;
    case 'KeyF': toggleFullscreen(); break;
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => {
  for(const k in keys) keys[k] = false;
  if(state === 'play') togglePause(true);
});

const kLeft  = () => keys.ArrowLeft  || keys.KeyA || keys.KeyQ;
const kRight = () => keys.ArrowRight || keys.KeyD;
const kUp    = () => keys.ArrowUp    || keys.KeyW || keys.KeyZ;
const kDown  = () => keys.ArrowDown  || keys.KeyS;
const kFocus = () => keys.ShiftLeft || keys.ShiftRight || keys.ControlLeft || btnFocus.id !== null;
const kFire  = () => keys.Space || keys.KeyJ || mouseFire;

let mouseFire = false;
const pointers = new Map();
let moveId = null, anchor = null;
const btnBomb  = { x: VW - 62, y: VH - 62, r: 40, id: null };
const btnFocus = { x: 62,      y: VH - 62, r: 40, id: null };
const inBtn = (b, p) => touchMode && dist2(p.x, p.y, b.x, b.y) < (b.r + 16) * (b.r + 16);

function toLocal(e){
  const r = view.getBoundingClientRect();
  return { x: (e.clientX - r.left) / viewScale, y: (e.clientY - r.top) / viewScale };
}
view.addEventListener('pointerdown', e => {
  SND.unlock();
  if(e.pointerType !== 'mouse') touchMode = true;
  try { view.setPointerCapture(e.pointerId); } catch(_){}
  const p = toLocal(e);
  pointers.set(e.pointerId, p);
  confirmReq = true;
  if(e.button === 2){ bombReq = true; return; }
  if(inBtn(btnBomb, p)){ btnBomb.id = e.pointerId; bombReq = true; return; }
  if(inBtn(btnFocus, p)){ btnFocus.id = e.pointerId; return; }
  if(moveId === null){
    moveId = e.pointerId;
    anchor = { px: p.x, py: p.y, sx: player ? player.x : VW/2, sy: player ? player.y : VH - 150,
               mouse: e.pointerType === 'mouse' };
    if(e.pointerType === 'mouse') mouseFire = true;
  }
});
view.addEventListener('pointermove', e => {
  if(!pointers.has(e.pointerId)) return;
  const p = toLocal(e);
  pointers.set(e.pointerId, p);
});
function releasePointer(e){
  pointers.delete(e.pointerId);
  if(moveId === e.pointerId){ moveId = null; anchor = null; mouseFire = false; }
  if(btnBomb.id === e.pointerId) btnBomb.id = null;
  if(btnFocus.id === e.pointerId) btnFocus.id = null;
}
view.addEventListener('pointerup', releasePointer);
view.addEventListener('pointercancel', releasePointer);
view.addEventListener('contextmenu', e => e.preventDefault());

function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement) (el.requestFullscreen && el.requestFullscreen());
  else (document.exitFullscreen && document.exitFullscreen());
}

/* ---------------------------------------------------------------
   4. SON — synthèse WebAudio (SFX + musique séquencée)
   --------------------------------------------------------------- */
const SND = {
  ac: null, master: null, musicBus: null, sfxBus: null, noise: null,
  muted: false, ready: false, mood: null, timerId: 0,
  step: 0, nextTime: 0, bpm: 150, cfg: null, grazeCd: 0,

  unlock(){
    if(this.ready){ if(this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try { this.ac = new AC(); } catch(_){ return; }
    const ac = this.ac;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 9;
    comp.attack.value = 0.003; comp.release.value = 0.22;
    this.master = ac.createGain(); this.master.gain.value = 0.85;
    this.master.connect(comp); comp.connect(ac.destination);
    this.musicBus = ac.createGain(); this.musicBus.gain.value = 0.34; this.musicBus.connect(this.master);
    this.sfxBus   = ac.createGain(); this.sfxBus.gain.value   = 0.62; this.sfxBus.connect(this.master);
    // buffer de bruit blanc réutilisable
    const n = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = n.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noise = n;
    this.ready = true;
    this.setMood(state === 'menu' ? 'menu' : 'stage');
    this.timerId = setInterval(() => this.schedule(), 25);
  },
  toggleMute(){
    this.unlock();
    this.muted = !this.muted;
    if(this.master) this.master.gain.value = this.muted ? 0 : 0.85;
    toast(this.muted ? 'SON : COUPÉ' : 'SON : ACTIF');
  },
  /* --- briques de synthèse --- */
  osc(type, f0, f1, t0, dur, vol, dest){
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.012, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || this.sfxBus);
    o.start(t0); o.stop(t0 + dur + 0.02);
    return { o: o, g: g };
  },
  hiss(t0, dur, vol, f0, f1, type, dest){
    const ac = this.ac, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = this.noise; s.loop = true;
    f.type = type || 'lowpass';
    f.frequency.setValueAtTime(f0, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    f.Q.value = 1.1;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfxBus);
    s.start(t0); s.stop(t0 + dur + 0.02);
  },
  /* --- effets --- */
  shot(kind){
    if(!this.ready || this.muted) return;
    const t = this.ac.currentTime;
    if(kind === 'laser'){ this.osc('sawtooth', 1750, 620, t, 0.09, 0.10); this.osc('square', 900, 400, t, 0.06, 0.05); }
    else if(kind === 'plasma'){ this.osc('sine', 680, 210, t, 0.13, 0.12); this.osc('triangle', 1300, 500, t, 0.08, 0.05); }
    else { this.osc('square', 1180, 330, t, 0.055, 0.075); this.hiss(t, 0.035, 0.045, 3200, 900, 'highpass'); }
  },
  hit(){
    if(!this.ready || this.muted) return;
    this.hiss(this.ac.currentTime, 0.045, 0.10, 5200, 2200, 'highpass');
  },
  graze(){
    if(!this.ready || this.muted || this.grazeCd > 0) return;
    this.grazeCd = 5;
    this.osc('sine', 2400, 3300, this.ac.currentTime, 0.05, 0.055);
  },
  boom(size){
    if(!this.ready || this.muted) return;
    const t = this.ac.currentTime, s = clamp(size, 0.4, 3);
    this.hiss(t, 0.20 + s * 0.22, 0.16 + s * 0.10, 1400 + s * 900, 70, 'lowpass');
    this.osc('sine', 170 * (1.5 - s * 0.2), 32, t, 0.22 + s * 0.2, 0.16 + s * 0.08);
    if(s > 1.4) this.osc('triangle', 90, 28, t + 0.02, 0.5, 0.16);
  },
  pickup(){
    if(!this.ready || this.muted) return;
    const t = this.ac.currentTime;
    [0, 5, 9, 12].forEach((n, i) => this.osc('triangle', 523 * Math.pow(2, n/12), 523 * Math.pow(2, n/12), t + i*0.045, 0.09, 0.10));
  },
  levelup(){
    if(!this.ready || this.muted) return;
    const t = this.ac.currentTime;
    [0, 4, 7, 12, 16, 19].forEach((n, i) => this.osc('square', 392 * Math.pow(2, n/12), 392 * Math.pow(2, n/12), t + i*0.05, 0.11, 0.075));
  },
  hurt(){
    if(!this.ready || this.muted) return;
    const t = this.ac.currentTime;
    this.osc('sawtooth', 420, 60, t, 0.32, 0.20);
    this.hiss(t, 0.3, 0.16, 1800, 120, 'lowpass');
  },
  bomb(){
    if(!this.ready || this.muted) return;
    const t = this.ac.currentTime;
    this.osc('sine', 340, 34, t, 0.9, 0.34);
    this.hiss(t, 0.85, 0.30, 320, 6000, 'highpass');
    this.hiss(t + 0.03, 0.7, 0.22, 5000, 90, 'lowpass');
  },
  alarm(){
    if(!this.ready || this.muted) return;
    const t = this.ac.currentTime;
    for(let i = 0; i < 4; i++){
      this.osc('square', 880, 660, t + i*0.34, 0.16, 0.10);
      this.osc('square', 660, 880, t + i*0.34 + 0.17, 0.16, 0.10);
    }
  },
  bossDown(){
    if(!this.ready || this.muted) return;
    const t = this.ac.currentTime;
    for(let i = 0; i < 7; i++) this.boomAt(t + i * 0.13, 1 + i * 0.2);
    this.osc('sawtooth', 300, 24, t + 0.4, 1.6, 0.24);
  },
  boomAt(t, s){
    this.hiss(t, 0.25 + s*0.15, 0.14, 1500, 60, 'lowpass');
    this.osc('sine', 150, 30, t, 0.3, 0.13);
  },
  ui(){
    if(!this.ready || this.muted) return;
    this.osc('square', 660, 990, this.ac.currentTime, 0.07, 0.08);
  },

  /* --- musique : séquenceur 16 pas avec anticipation --- */
  setMood(m){
    if(!this.ready || this.mood === m) return;
    this.mood = m;
    this.cfg = MUSIC[m];
    this.bpm = this.cfg.bpm;
    this.step = 0;
    this.nextTime = this.ac.currentTime + 0.06;
  },
  schedule(){
    if(!this.ready || !this.cfg || this.muted) return;
    if(this.ac.state === 'suspended') return;
    const spb = 60 / this.bpm / 4;               // durée d'un pas (double-croche)
    let guard = 0;
    while(this.nextTime < this.ac.currentTime + 0.15 && guard++ < 32){
      this.playStep(this.step, this.nextTime, spb);
      this.step = (this.step + 1) % 64;
      this.nextTime += spb;
    }
    if(this.nextTime < this.ac.currentTime) this.nextTime = this.ac.currentTime + 0.02;
  },
  note(midi){ return 440 * Math.pow(2, (midi - 69) / 12); },
  playStep(step, t, spb){
    const c = this.cfg, bar = (step >> 4) & 3, s = step & 15;
    const root = c.roots[bar];
    const bus = this.musicBus;
    // grosse caisse
    if(c.drums && c.kick.indexOf(s) >= 0){
      this.osc('sine', 165, 42, t, 0.16, 0.55 * c.drums, bus);
      this.hiss(t, 0.05, 0.25 * c.drums, 900, 120, 'lowpass', bus);
    }
    // caisse claire
    if(c.drums && c.snare.indexOf(s) >= 0){
      this.hiss(t, 0.15, 0.24 * c.drums, 2400, 700, 'bandpass', bus);
      this.osc('triangle', 320, 180, t, 0.09, 0.16 * c.drums, bus);
    }
    // charleston
    if(c.drums && s % 2 === (c.offbeat ? 1 : 0)){
      this.hiss(t, s % 4 === 2 ? 0.07 : 0.035, 0.09 * c.drums, 9000, 5000, 'highpass', bus);
    }
    // basse
    if(c.bass.indexOf(s) >= 0){
      const f = this.note(root - 12 + (s === 14 ? 7 : 0));
      const o = this.osc('sawtooth', f, f, t, spb * 1.7, 0.30, bus);
      const flt = this.ac.createBiquadFilter();
      flt.type = 'lowpass'; flt.frequency.setValueAtTime(240 + (c.drive || 0) * 500, t);
      flt.frequency.exponentialRampToValueAtTime(120, t + spb * 1.7);
      o.g.disconnect(); o.g.connect(flt); flt.connect(bus);
    }
    // arpège
    if(s % (c.arpRate || 1) === 0){
      const n = c.arp[(step + bar) % c.arp.length];
      const f = this.note(root + 12 + n);
      this.osc(c.arpWave || 'square', f, f, t, spb * 0.95, 0.085, bus);
    }
    // mélodie
    if(c.lead && c.lead[s] !== undefined && c.lead[s] >= 0){
      const f = this.note(root + 24 + c.lead[s]);
      this.osc('triangle', f, f, t, spb * 2.4, 0.13, bus);
      this.osc('sine', f * 2, f * 2, t, spb * 1.2, 0.045, bus);
    }
    // nappe (une fois par mesure)
    if(s === 0 && c.pad){
      [0, 3, 7].forEach(n => {
        const f = this.note(root + n);
        this.osc('sawtooth', f, f, t, spb * 15, 0.05, bus);
      });
    }
  }
};

/* configurations musicales — Am naturel, descentes chromatiques pour les boss */
const MUSIC = {
  menu:  { bpm:112, roots:[45,41,48,43], drums:0.5, kick:[0,8], snare:[8], offbeat:1,
           bass:[0,6,8,14], arp:[0,7,12,15,12,7], arpRate:2, arpWave:'triangle', pad:1, lead:null },
  stage: { bpm:152, roots:[45,45,41,43], drums:1, kick:[0,3,8,11], snare:[4,12], offbeat:0,

/* ---------------------------------------------------------------
   5. DÉCOR — parallaxe, nébuleuses, grille, planètes
   --------------------------------------------------------------- */
const BG = {
  layers: [], nebulae: [], bodies: [], tile: null, tileY: 0,
  sky0: '#05061a', sky1: '#0a0b28', accent: '#3a6bff', accent2: '#b02cff', boost: 0,

  init(){
    this.layers = [];
    const specs = [[110, 0.35, 1.0, 0.45], [70, 0.85, 1.6, 0.7], [38, 1.9, 2.4, 1]];
    for(const [n, sp, sz, al] of specs){
      const st = [];
      for(let i = 0; i < n; i++) st.push({ x: rnd(0, VW), y: rnd(0, VH), s: rnd(sz * 0.5, sz), tw: rnd(0, TAU) });
      this.layers.push({ stars: st, speed: sp, alpha: al });
    }
    this.nebulae = [];
    for(let i = 0; i < 6; i++) this.nebulae.push(this.newNebula(rnd(-100, VH)));
    this.bodies = [];
    this.tile = null;
    this.applyStage(0);
  },
  newNebula(y){
    return { x: rnd(-60, VW + 60), y: y === undefined ? -320 : y, r: rnd(150, 330),
             a: rnd(0.05, 0.14), sp: rnd(0.08, 0.3), c: Math.random() < 0.5 ? this.accent : this.accent2 };
  },
  applyStage(i){
    const s = STAGES[clamp(i, 0, STAGES.length - 1)];
    this.sky0 = s.sky[0]; this.sky1 = s.sky[1];
    this.accent = s.neb[0]; this.accent2 = s.neb[1];
    for(const n of this.nebulae) n.c = Math.random() < 0.5 ? this.accent : this.accent2;
    // tuile de grille "techno" pré-rendue
    const S = 120;
    const c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    g.strokeStyle = rgba(s.grid, 0.30); g.lineWidth = 1;
    g.beginPath();
    g.moveTo(0.5, 0); g.lineTo(0.5, S); g.moveTo(0, 0.5); g.lineTo(S, 0.5);
    g.stroke();
    g.strokeStyle = rgba(s.grid, 0.14);
    g.beginPath();
    g.moveTo(60.5, 0); g.lineTo(60.5, S); g.moveTo(0, 60.5); g.lineTo(S, 60.5);
    g.stroke();
    g.fillStyle = rgba(s.grid, 0.5);
    g.fillRect(58, 58, 4, 4); g.fillRect(0, 0, 3, 3);
    this.tile = ctx.createPattern(c, 'repeat');
    this.bodies.push({ x: rnd(40, VW - 40), y: -420, r: rnd(90, 170), sp: rnd(0.12, 0.28),
                       c: s.body, glowc: s.neb[0] });
  },
  update(){
    const sp = 1 + this.boost;
    this.boost *= 0.94;
    for(const L of this.layers){
      for(const st of L.stars){
        st.y += L.speed * sp;
        st.tw += 0.06;
        if(st.y > VH){ st.y -= VH + rnd(0, 40); st.x = rnd(0, VW); }
      }
    }
    for(let i = this.nebulae.length - 1; i >= 0; i--){
      const n = this.nebulae[i];
      n.y += n.sp * sp;
      if(n.y - n.r > VH) this.nebulae[i] = this.newNebula();
    }
    for(let i = this.bodies.length - 1; i >= 0; i--){
      const b = this.bodies[i];
      b.y += b.sp * sp;
      if(b.y - b.r > VH + 60) this.bodies.splice(i, 1);
    }
    this.tileY = (this.tileY + 0.55 * sp) % 120;
  },
  draw(){
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, this.sky0); g.addColorStop(1, this.sky1);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

    for(const n of this.nebulae) glow(n.x, n.y, n.r, n.c, n.a);

    if(this.tile){
      ctx.save();
      ctx.translate(0, this.tileY);
      ctx.fillStyle = this.tile;
      ctx.fillRect(0, -120, VW, VH + 240);
      ctx.restore();
    }
    for(const b of this.bodies){
      glow(b.x, b.y, b.r * 1.5, b.glowc, 0.16);
      const gg = ctx.createRadialGradient(b.x - b.r*0.35, b.y - b.r*0.4, b.r*0.1, b.x, b.y, b.r);
      gg.addColorStop(0, shade(b.c, 40)); gg.addColorStop(0.6, b.c); gg.addColorStop(1, '#05050f');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgba(b.glowc, 0.5); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, -2.4, -0.5); ctx.stroke();
    }
    let li = 0;
    for(const L of this.layers){
      const boost = this.boost;
      for(const st of L.stars){
        const a = L.alpha * (0.55 + Math.sin(st.tw) * 0.35);
        ctx.fillStyle = 'rgba(200,225,255,' + a.toFixed(3) + ')';
        if(boost > 0.4) ctx.fillRect(st.x, st.y, st.s, st.s + boost * L.speed * 14);
        else ctx.fillRect(st.x, st.y, st.s, st.s);
      }
      li++;
    }
  }
};

/* ---------------------------------------------------------------
   6. PARTICULES, ONDES DE CHOC, TEXTES FLOTTANTS
   --------------------------------------------------------------- */
let parts = [], waves = [], floats = [];
const PART_MAX = 1100;

function addPart(p){
  if(parts.length > PART_MAX) parts.splice(0, 40);
  parts.push(p);
}
function spark(x, y, n, color, spd, life, size){
  for(let i = 0; i < n; i++){
    const a = rnd(0, TAU), s = rnd(spd * 0.25, spd);
    addPart({ k:'spark', x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(life*0.5, life),
              max:life, c:color, sz:size || 2, drag:0.94, grav:0 });
  }
}
function coneSpark(x, y, n, ang, spread, color, spd, life){
  for(let i = 0; i < n; i++){
    const a = ang + rnd(-spread, spread), s = rnd(spd * 0.3, spd);
    addPart({ k:'spark', x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(life*0.5, life),
              max:life, c:color, sz:2, drag:0.92, grav:0 });
  }
}
function smoke(x, y, n, color, spd, life, size){
  for(let i = 0; i < n; i++){
    const a = rnd(0, TAU), s = rnd(0, spd);
    addPart({ k:'smoke', x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:life, max:life,
              c:color, sz:size, drag:0.95, grav:0, grow:rnd(0.4, 1.2) });
  }
}
function debris(x, y, n, color, spd, life){
  for(let i = 0; i < n; i++){
    const a = rnd(0, TAU), s = rnd(spd * 0.3, spd);
    addPart({ k:'debris', x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:life, max:life,
              c:color, sz:rnd(3, 8), rot:rnd(0, TAU), spin:rnd(-0.25, 0.25), drag:0.985, grav:0.03 });
  }
}
function shockwave(x, y, maxR, color, width, life){
  waves.push({ x:x, y:y, r:6, max:maxR, c:color, w:width || 3, life:life || 26, max2:life || 26 });
}
function explode(x, y, size, color){
  const s = clamp(size, 0.4, 3.2);
  shockwave(x, y, 40 * s + 28, color || '#ffd9a0', 3 * s, 22 + s * 6);
  spark(x, y, (10 + s * 14) | 0, color || '#ffcc66', 3 + s * 2.4, 22 + s * 12, 2.2);
  spark(x, y, (6 + s * 8) | 0, '#ffffff', 2 + s * 2, 14 + s * 6, 1.6);
  smoke(x, y, (4 + s * 5) | 0, '#6a5a7a', 1.2 * s, 40 + s * 14, 10 * s);
  debris(x, y, (3 + s * 4) | 0, color || '#ff9944', 2 + s, 45 + s * 10);
  addPart({ k:'flash', x:x, y:y, vx:0, vy:0, life:9, max:9, c:'#fff5d0', sz:30 * s });
  SND.boom(s);
  shake(3 + s * 4);
}
function floater(x, y, text, color, size){
  floats.push({ x:x, y:y, t:text, c:color, s:size || 14, life:44, max:44, vy:-0.9 });
}

function updateFx(){
  for(let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= p.drag; p.vy *= p.drag;
    if(p.grav) p.vy += p.grav;
    if(p.spin) p.rot += p.spin;
    if(p.grow) p.sz += p.grow;
    if(--p.life <= 0) parts.splice(i, 1);
  }
  for(let i = waves.length - 1; i >= 0; i--){
    const w = waves[i];
    w.r += (w.max - w.r) * 0.18;
    if(--w.life <= 0) waves.splice(i, 1);
  }
  for(let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.y += f.vy; f.vy *= 0.95;
    if(--f.life <= 0) floats.splice(i, 1);
  }
}
function drawParts(front){
  ctx.globalCompositeOperation = 'lighter';
  for(const p of parts){
    const t = p.life / p.max;
    if(p.k === 'smoke'){
      if(front) continue;
      ctx.globalAlpha = t * 0.30;
      ctx.drawImage(glowSprite(p.c), p.x - p.sz, p.y - p.sz, p.sz * 2, p.sz * 2);
    } else if(!front) continue;
    else if(p.k === 'spark'){
      const sp = Math.hypot(p.vx, p.vy);
      ctx.globalAlpha = clamp(t * 1.2, 0, 1);
      if(sp > 1.4){
        ctx.strokeStyle = p.c; ctx.lineWidth = p.sz * t;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2); ctx.stroke();
      } else {
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x - p.sz/2, p.y - p.sz/2, p.sz, p.sz);
      }
    } else if(p.k === 'debris'){
      ctx.globalAlpha = clamp(t * 1.4, 0, 1);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.sz/2, -p.sz/4, p.sz, p.sz/2);
      ctx.restore();
    } else if(p.k === 'flash'){
      ctx.globalAlpha = t * t;
      ctx.drawImage(glowSprite(p.c), p.x - p.sz, p.y - p.sz, p.sz*2, p.sz*2);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
function drawWaves(){
  ctx.globalCompositeOperation = 'lighter';
  for(const w of waves){
    const t = w.life / w.max2;
    ctx.globalAlpha = t * t;
    ctx.strokeStyle = w.c; ctx.lineWidth = w.w * t;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
function drawFloats(){
  for(const f of floats){
    const t = f.life / f.max;
    ctx.globalAlpha = clamp(t * 1.6, 0, 1);
    txt(f.t, f.x, f.y, f.s, f.c, 'center', 'bold', 8);
  }
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------------
   7. JOUEUR — vaisseau, armes, drones, bouclier, OVERDRIVE
   --------------------------------------------------------------- */
const WEAPONS = {
  vulcan: { name:'VULCAN', tag:'V', color:'#5ef0ff', rate:[7,6,5,5,4], dmg:7,
            desc:'cadence élevée, tir large' },
  laser:  { name:'LASER',  tag:'L', color:'#a97bff', rate:[9,8,7,6,6], dmg:13,
            desc:'perforant, dégâts concentrés' },
  plasma: { name:'PLASMA', tag:'P', color:'#66ff9e', rate:[13,12,11,10,9], dmg:16,
            desc:'têtes chercheuses à impact' }
};

let player = null;
function makePlayer(){
  return {
    x: VW/2, y: VH - 150, vx:0, vy:0, r:6,
    hp:120, maxHp:120, lives:3,
    energy:0, maxEnergy:100,
    weapon:'vulcan', level:1,
    options:0, optAng:0,
    shield:0,                 // charges de bouclier
    fireT:0, invul:120, dead:false, deadT:0,
    tilt:0, engine:0, focusMix:0,
    grazeCombo:0
  };
}

function playerSpeed(){ return kFocus() ? 2.6 : 5.6; }

function updatePlayer(){
  const p = player;
  if(p.dead){
    if(--p.deadT <= 0) respawn();
    return;
  }
  /* --- déplacement --- */
  const sp = playerSpeed();
  let dx = 0, dy = 0;
  if(kLeft())  dx -= 1;
  if(kRight()) dx += 1;
  if(kUp())    dy -= 1;
  if(kDown())  dy += 1;
  if(dx && dy){ dx *= 0.7071; dy *= 0.7071; }

  let tx = p.x + dx * sp, ty = p.y + dy * sp;

  if(moveId !== null && anchor && pointers.has(moveId)){
    const q = pointers.get(moveId);
    if(anchor.mouse){                       // souris : suivi direct
      const mdx = q.x - p.x, mdy = q.y - p.y;
      const md = Math.hypot(mdx, mdy);
      const step = Math.min(md, sp * 1.5);
      if(md > 0.5){ tx = p.x + mdx / md * step; ty = p.y + mdy / md * step; }
    } else {                                // tactile : glissement relatif
      tx = clamp(anchor.sx + (q.x - anchor.px) * 1.35, 0, VW);
      ty = clamp(anchor.sy + (q.y - anchor.py) * 1.35, 0, VH);
      const mdx = tx - p.x, mdy = ty - p.y;
      const md = Math.hypot(mdx, mdy);
      const step = Math.min(md, sp * 1.6);
      if(md > 0.5){ tx = p.x + mdx / md * step; ty = p.y + mdy / md * step; }
      else { tx = p.x; ty = p.y; }
    }
  }
  p.vx = tx - p.x; p.vy = ty - p.y;
  p.x = clamp(tx, 16, VW - 16);
  p.y = clamp(ty, 30, VH - 24);
  p.tilt = lerp(p.tilt, clamp(p.vx / 6, -1, 1), 0.2);
  p.focusMix = lerp(p.focusMix, kFocus() ? 1 : 0, 0.25);

  /* --- tir --- */
  if(p.fireT > 0) p.fireT--;
  if((autofire || kFire()) && p.fireT <= 0 && !p.dead){
    fireWeapon();
    const W = WEAPONS[p.weapon];
    p.fireT = W.rate[clamp(p.level, 1, 5) - 1];
  }

  /* --- drones --- */
  p.optAng += 0.045;

  /* --- OVERDRIVE --- */
  if(bombReq){
    bombReq = false;
    if(state === 'play') triggerBomb();
  }

  if(p.invul > 0) p.invul--;
  if(p.energy < p.maxEnergy) p.energy = Math.min(p.maxEnergy, p.energy + 0.035);

  /* réacteur */
  p.engine += 0.4;
  if(gameFrame % 2 === 0){
    addPart({ k:'spark', x:p.x + rnd(-3,3), y:p.y + 16, vx:rnd(-0.3,0.3), vy:rnd(1.6,3.4),
              life:12, max:12, c: p.focusMix > 0.5 ? '#a9f7ff' : '#54d8ff', sz:2.4, drag:0.94, grav:0 });
  }
}

function optionPos(i){
  const p = player, n = p.options;
  if(kFocus()){
    const off = (i === 0 ? -20 : 20);
    return { x: p.x + off, y: p.y + 10 };
  }
  const a = p.optAng + i * Math.PI;
  return { x: p.x + Math.cos(a) * 34, y: p.y + Math.sin(a) * 26 + 6 };
}

function shoot(x, y, ang, speed, dmg, type){
  const W = WEAPONS[type];
  pb.push({ x:x, y:y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
            dmg:dmg, r: type === 'plasma' ? 7 : (type === 'laser' ? 4 : 3.5),
            type:type, c:W.color, pierce: type === 'laser' ? 1 : 0, hitIds:null,
            homing: type === 'plasma' ? 1 : 0, life:150, ang:ang });
}

function fireWeapon(){
  const p = player, W = WEAPONS[p.weapon], L = clamp(p.level, 1, 5);
  const up = -Math.PI/2;
  const focus = kFocus() ? 0.45 : 1;
  const dmg = W.dmg;

  if(p.weapon === 'vulcan'){
    const n = L + 1;
    const spread = 0.10 * focus;
    for(let i = 0; i < n; i++){
      const t = n === 1 ? 0 : (i / (n - 1) - 0.5) * 2;
      shoot(p.x + t * 9, p.y - 12, up + t * spread * 1.6, 13, dmg, 'vulcan');
    }
  } else if(p.weapon === 'laser'){
    const n = Math.ceil(L / 2);
    for(let i = 0; i < n; i++){
      const off = n === 1 ? 0 : (i / (n - 1) - 0.5) * 22;
      const b = { x:p.x + off, y:p.y - 14, vx:0, vy:-17, dmg:dmg + L * 2, r:4.5, type:'laser',
                  c:WEAPONS.laser.color, pierce: 2 + L, hitIds:[], homing:0, life:90, ang:up };
      pb.push(b);
    }
  } else {
    const n = 1 + ((L - 1) >> 1);
    for(let i = 0; i < n; i++){
      const off = (i - (n - 1) / 2) * 16;
      const b = { x:p.x + off, y:p.y - 10, vx:off * 0.12, vy:-9, dmg:dmg + L * 3, r:8, type:'plasma',
                  c:WEAPONS.plasma.color, pierce:0, hitIds:null, homing:1, life:170, ang:up, splash:34 };
      pb.push(b);
    }
  }
  /* drones */
  for(let i = 0; i < p.options; i++){
    const o = optionPos(i);
    if(p.weapon === 'plasma'){
      pb.push({ x:o.x, y:o.y, vx:0, vy:-8.5, dmg:10, r:6, type:'plasma', c:'#8affc0',
                pierce:0, hitIds:null, homing:1, life:150, ang:up, splash:24 });
    } else if(p.weapon === 'laser'){
      pb.push({ x:o.x, y:o.y, vx:0, vy:-16, dmg:9, r:3.5, type:'laser', c:'#c9a6ff',
                pierce:2, hitIds:[], homing:0, life:90, ang:up });
    } else {
      shoot(o.x, o.y, up, 12.5, 5, 'vulcan');
    }
  }
  coneSpark(p.x, p.y - 14, 2, -Math.PI/2, 0.5, W.color, 2.4, 8);
  SND.shot(p.weapon);
}

function triggerBomb(){
  const p = player;
  if(p.dead) return;
  if(p.energy < p.maxEnergy){
    SND.ui();
    toast('OVERDRIVE : ' + Math.floor(p.energy) + '%');
    return;
  }
  p.energy = 0;
  p.invul = Math.max(p.invul, 150);
  bombFx = 90;
  SND.bomb();
  flash('#bff4ff', 0.85);
  shake(16); freeze(6); BG.boost = 2.2;
  shockwave(p.x, p.y, VW * 1.25, '#9ff0ff', 12, 46);
  shockwave(p.x, p.y, VW * 0.8, '#ffffff', 6, 34);
  spark(p.x, p.y, 90, '#bff4ff', 12, 46, 3);
  floater(p.x, p.y - 40, 'OVERDRIVE', '#bff4ff', 22);
}

/* dégâts du joueur */
function hurtPlayer(amount, sx, sy){
  const p = player;
  if(p.dead || p.invul > 0 || state !== 'play') return;
  if(p.shield > 0){
    p.shield--;
    p.invul = 40;
    SND.hit(); shake(5);
    shockwave(p.x, p.y, 60, '#5ee7ff', 4, 20);
    spark(p.x, p.y, 18, '#5ee7ff', 4, 24, 2);
    floater(p.x, p.y - 26, 'BOUCLIER', '#5ee7ff', 13);
    return;
  }
  p.hp -= amount;
  combo = 0;
  chroma = 1;
  SND.hurt(); shake(9); flash('#ff2a4a', 0.30); freeze(3);
  spark(sx === undefined ? p.x : sx, sy === undefined ? p.y : sy, 22, '#ff5577', 5, 28, 2.4);
  if(p.hp <= 0) killPlayer();
  else p.invul = 90;
}

function killPlayer(){
  const p = player;
  p.hp = 0; p.dead = true; p.deadT = 110; p.lives--;
  stats.deaths++;
  dirState.noDeath = false;
  explode(p.x, p.y, 2.6, '#7fd8ff');
  explode(p.x + rnd(-20,20), p.y + rnd(-20,20), 1.6, '#ffffff');
  shake(20); freeze(8); slowmo(0.35, 60); flash('#ffffff', 0.5);
  clearBulletsAround(p.x, p.y, 260);
  if(p.lives < 0){ after(80, () => gameOver()); }
}

function respawn(){
  const p = player;
  if(p.lives < 0) return;
  p.dead = false;
  p.hp = p.maxHp;
  p.x = VW/2; p.y = VH - 130;
  p.invul = 150;
  p.level = Math.max(1, p.level - 1);
  p.options = Math.max(0, p.options - 1);
  p.energy = Math.max(p.energy, 45);
  shockwave(p.x, p.y, 120, '#7fd8ff', 5, 30);
  spark(p.x, p.y, 40, '#7fd8ff', 5, 30, 2);
}

/* ---- rendu du vaisseau ---- */
function drawPlayer(){
  const p = player;
  if(p.dead) return;
  const blink = p.invul > 0 && (gameFrame >> 2) % 2 === 0;
  ctx.save();
  ctx.translate(p.x, p.y);

  // réacteur
  const fl = 1 + Math.sin(p.engine) * 0.22;
  glow(0, 18 + fl * 4, 26 * fl, '#2ba8ff', 0.75);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = '#8ceaff';
  ctx.beginPath();
  ctx.moveTo(-6, 12); ctx.lineTo(0, 22 + fl * 11); ctx.lineTo(6, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(-2.5, 12); ctx.lineTo(0, 18 + fl * 6); ctx.lineTo(2.5, 12); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.rotate(p.tilt * 0.22);
  ctx.globalAlpha = blink ? 0.45 : 1;

  // ailes
  ctx.fillStyle = '#1d3a86';
  ctx.beginPath();
  ctx.moveTo(-9, -2); ctx.lineTo(-26, 12); ctx.lineTo(-22, 17); ctx.lineTo(-7, 12); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(9, -2); ctx.lineTo(26, 12); ctx.lineTo(22, 17); ctx.lineTo(7, 12); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#59b7ff'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-24, 12); ctx.lineTo(-9, 4); ctx.moveTo(24, 12); ctx.lineTo(9, 4); ctx.stroke();

  // coque
  const gr = ctx.createLinearGradient(0, -22, 0, 18);
  gr.addColorStop(0, '#eaf7ff'); gr.addColorStop(0.45, '#7fb8ff'); gr.addColorStop(1, '#16276b');
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.moveTo(0, -24);
  ctx.lineTo(7, -6); ctx.lineTo(11, 10); ctx.lineTo(5, 16);
  ctx.lineTo(-5, 16); ctx.lineTo(-11, 10); ctx.lineTo(-7, -6);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#cfeaff'; ctx.lineWidth = 1.1; ctx.stroke();

  // cockpit
  const cg = ctx.createLinearGradient(0, -12, 0, 2);
  cg.addColorStop(0, '#ffffff'); cg.addColorStop(1, WEAPONS[p.weapon].color);
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.ellipse(0, -8, 3.6, 7, 0, 0, TAU); ctx.fill();

  ctx.globalAlpha = 1;
  ctx.restore();

  // hitbox en mode focus
  if(p.focusMix > 0.02){
    glow(p.x, p.y, 16 * p.focusMix, '#ff5ac8', p.focusMix * 0.8);
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = p.focusMix;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.75, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ff5ac8'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 3 + Math.sin(gameFrame * 0.2), 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // bouclier
  if(p.shield > 0){
    const a = 0.30 + Math.sin(gameFrame * 0.12) * 0.12 + p.shield * 0.07;
    ctx.strokeStyle = 'rgba(94,231,255,' + a.toFixed(2) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, TAU); ctx.stroke();
    glow(p.x, p.y, 34, '#5ee7ff', 0.22);
    for(let i = 0; i < p.shield; i++){
      const a2 = gameFrame * 0.03 + i * TAU / 3;
      ctx.fillStyle = '#9ff2ff';
      ctx.beginPath(); ctx.arc(p.x + Math.cos(a2) * 26, p.y + Math.sin(a2) * 26, 3, 0, TAU); ctx.fill();
    }
  }

  // invulnérabilité
  if(p.invul > 60 && !p.dead){
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.15 + (p.invul / 150) * 0.25).toFixed(2) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, 30 - (p.invul % 30) * 0.4, 0, TAU); ctx.stroke();
  }

  // drones
  for(let i = 0; i < p.options; i++){
    const o = optionPos(i);
    const a = gameFrame * 0.1 + i;
    glow(o.x, o.y, 16, WEAPONS[p.weapon].color, 0.55);
    ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(a * 0.5);
    ctx.fillStyle = '#dff3ff';
    ctx.beginPath();
    ctx.moveTo(0, -7); ctx.lineTo(6, 0); ctx.lineTo(0, 7); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = WEAPONS[p.weapon].color;
    ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------
   8. PROJECTILES DU JOUEUR
   --------------------------------------------------------------- */
let pb = [];

/* cible la plus proche pour les projectiles à tête chercheuse */
function nearestTarget(x, y, maxD){
  let best = null, bd = maxD * maxD;
  for(let i = 0; i < foes.length; i++){
    const e = foes[i];
    if(e.dead) continue;
    const d = dist2(x, y, e.x, e.y);
    if(d < bd){ bd = d; best = e; }
  }
  if(boss && !boss.dead && !boss.gone && !boss.entering){
    const d = dist2(x, y, boss.x, boss.y);
    if(d < bd){ bd = d; best = boss; }
  }
  return best;
}

function updatePlayerBullets(){
  for(let i = pb.length - 1; i >= 0; i--){
    const b = pb[i];
    if(b.homing){
      const t = nearestTarget(b.x, b.y, 300);
      if(t){
        const want = aim(b.x, b.y, t.x, t.y);
        const cur = Math.atan2(b.vy, b.vx);
        let d = want - cur;
        while(d > Math.PI) d -= TAU;
        while(d < -Math.PI) d += TAU;
        const na = cur + clamp(d, -0.11, 0.11);
        const sp = Math.hypot(b.vx, b.vy) * 1.015;
        b.vx = Math.cos(na) * Math.min(sp, 12);
        b.vy = Math.sin(na) * Math.min(sp, 12);
      }
      if(gameFrame % 2 === 0)
        addPart({ k:'spark', x:b.x, y:b.y, vx:rnd(-.4,.4), vy:rnd(-.4,.4), life:10, max:10,
                  c:b.c, sz:2, drag:0.9, grav:0 });
    }
    b.x += b.vx; b.y += b.vy;
    if(--b.life <= 0 || b.y < -30 || b.y > VH + 30 || b.x < -30 || b.x > VW + 30) pb.splice(i, 1);
  }
}

function drawPlayerBullets(){
  ctx.globalCompositeOperation = 'lighter';
  for(const b of pb){
    if(b.type === 'laser'){
      ctx.globalAlpha = 0.5;
      ctx.drawImage(glowSprite(b.c), b.x - 16, b.y - 30, 32, 60);
      ctx.globalAlpha = 1;
      ctx.fillStyle = b.c;
      ctx.fillRect(b.x - 2.5, b.y - 18, 5, 34);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(b.x - 1, b.y - 16, 2, 30);
    } else if(b.type === 'plasma'){
      const s = 1 + Math.sin(gameFrame * 0.4 + b.x) * 0.12;
      ctx.globalAlpha = 0.85;
      ctx.drawImage(glowSprite(b.c), b.x - 20*s, b.y - 20*s, 40*s, 40*s);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, 3.4 * s, 0, TAU); ctx.fill();
    } else {
      ctx.globalAlpha = 0.7;
      ctx.drawImage(glowSprite(b.c), b.x - 11, b.y - 14, 22, 28);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(b.x - 1.6, b.y - 8, 3.2, 15);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------------
   9. PROJECTILES ENNEMIS
   --------------------------------------------------------------- */
let eb = [];
const EB_MAX = 900;

function ebullet(x, y, ang, speed, o){
  o = o || {};
  if(eb.length > EB_MAX) eb.shift();
  const spd = speed * (o.raw ? 1 : bulletSpeed);
  eb.push({
    x:x, y:y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
    r: o.r || 6, c: o.c || '#ff4d6d', kind: o.kind || 'orb',
    life: o.life || 620, spin: rnd(0, TAU), grazed:0,
    turn: o.turn || 0, accel: o.accel || 0, homing: o.homing || 0,
    fuse: o.fuse || 0, ang: ang, dmg: o.dmg || 16
  });
  return eb[eb.length - 1];
}

function updateEnemyBullets(){
  const p = player;
  for(let i = eb.length - 1; i >= 0; i--){
    const b = eb[i];
    if(b.turn){
      const a = Math.atan2(b.vy, b.vx) + b.turn;
      const s = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;
    }
    if(b.homing && !p.dead && b.life > 40){
      const want = aim(b.x, b.y, p.x, p.y);
      const cur = Math.atan2(b.vy, b.vx);
      let d = want - cur;
      while(d > Math.PI) d -= TAU;
      while(d < -Math.PI) d += TAU;
      const na = cur + clamp(d, -b.homing, b.homing);
      const s = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(na) * s; b.vy = Math.sin(na) * s;
      if(gameFrame % 3 === 0)
        addPart({ k:'spark', x:b.x, y:b.y, vx:0, vy:0, life:12, max:12, c:b.c, sz:2, drag:0.9, grav:0 });
    }
    if(b.accel){
      b.vx *= 1 + b.accel; b.vy *= 1 + b.accel;
    }
    b.x += b.vx; b.y += b.vy;
    b.spin += 0.12;

    if(b.fuse && --b.fuse <= 0){
      const n = 10;
      for(let k = 0; k < n; k++) ebullet(b.x, b.y, k / n * TAU + rnd(0,1), 2.4, { r:5, c:'#ff5ce1', kind:'orb' });
      spark(b.x, b.y, 10, '#ff5ce1', 3, 18, 2);
      eb.splice(i, 1);
      continue;
    }
    if(--b.life <= 0 || b.y < -60 || b.y > VH + 60 || b.x < -60 || b.x > VW + 60){ eb.splice(i, 1); continue; }

    /* frôlement (graze) : de l'énergie contre du risque */
    if(!b.grazed && !p.dead && p.invul <= 0 && state === 'play'){
      const d2 = dist2(b.x, b.y, p.x, p.y);
      const gr = 26 + b.r;
      if(d2 < gr * gr){
        b.grazed = 1;
        stats.graze++;
        player.energy = Math.min(player.maxEnergy, player.energy + 1.1);
        addScore(15, 0);
        SND.graze();
        addPart({ k:'spark', x:b.x, y:b.y, vx:rnd(-1,1), vy:rnd(-1,1), life:14, max:14,
                  c:'#ffffff', sz:2, drag:0.9, grav:0 });
      }
    }
  }
}

function drawEnemyBullets(){
  ctx.globalCompositeOperation = 'lighter';
  for(const b of eb){
    const r = b.r;
    ctx.globalAlpha = 0.55;
    ctx.drawImage(glowSprite(b.c), b.x - r*1.7, b.y - r*1.7, r*3.4, r*3.4);
    ctx.globalAlpha = 1;
    if(b.kind === 'needle'){
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.moveTo(r*2.4, 0); ctx.lineTo(-r*1.6, r*0.85); ctx.lineTo(-r*1.6, -r*0.85); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(r*1.5, 0); ctx.lineTo(-r*0.8, r*0.35); ctx.lineTo(-r*0.8, -r*0.35); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if(b.kind === 'shard'){
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.spin);
      ctx.fillStyle = b.c;
      ctx.beginPath();
      ctx.moveTo(0, -r*1.6); ctx.lineTo(r, 0); ctx.lineTo(0, r*1.6); ctx.lineTo(-r, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, r*0.42, 0, TAU); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(b.x - r*0.12, b.y - r*0.16, r * 0.32, 0, TAU); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function clearBulletsAround(x, y, radius){
  const r2 = radius * radius;
  for(let i = eb.length - 1; i >= 0; i--){
    if(dist2(eb[i].x, eb[i].y, x, y) < r2){
      addPart({ k:'spark', x:eb[i].x, y:eb[i].y, vx:rnd(-2,2), vy:rnd(-2,2), life:14, max:14,
                c:'#ffe6a0', sz:2, drag:0.9, grav:0 });
      addScore(10, 0);
      eb.splice(i, 1);
    }
  }
}

/* ---------------------------------------------------------------
   10. BONUS RAMASSABLES
   --------------------------------------------------------------- */
const DROPS = {
  vulcan: { tag:'V', c:'#5ef0ff', label:'VULCAN' },
  laser:  { tag:'L', c:'#a97bff', label:'LASER' },
  plasma: { tag:'P', c:'#66ff9e', label:'PLASMA' },
  option: { tag:'O', c:'#ffd54a', label:'DRONE' },
  shield: { tag:'S', c:'#5ee7ff', label:'BOUCLIER' },
  repair: { tag:'+', c:'#ff6b9d', label:'RÉPARATION' },
  energy: { tag:'E', c:'#ffa53a', label:'ÉNERGIE' },
  bonus:  { tag:'★', c:'#ffe14a', label:'BONUS' }
};
let drops = [];

function spawnDrop(x, y, type){
  if(!type){
    const pool = ['vulcan','laser','plasma','option','shield','repair','energy','bonus','bonus'];
    type = pick(pool);
  }
  drops.push({ type:type, x:x, y:y, vx:rnd(-1.1,1.1), vy:rnd(-2.6,-1.2), t:0, life:900 });
}

function updateDrops(){
  const p = player;
  for(let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.t++;
    d.vy = Math.min(d.vy + 0.06, 1.5);
    d.vx *= 0.985;
    const dd = dist2(d.x, d.y, p.x, p.y);
    if(!p.dead && dd < 150 * 150){                    // aimant
      const a = aim(d.x, d.y, p.x, p.y);
      const pull = 0.55 + (1 - Math.sqrt(dd) / 150) * 1.6;
      d.vx += Math.cos(a) * pull; d.vy += Math.sin(a) * pull;
      d.vx = clamp(d.vx, -9, 9); d.vy = clamp(d.vy, -9, 9);
    }
    d.x += d.vx; d.y += d.vy;
    if(d.x < 14){ d.x = 14; d.vx = Math.abs(d.vx); }
    if(d.x > VW - 14){ d.x = VW - 14; d.vx = -Math.abs(d.vx); }
    if(!p.dead && dd < 26 * 26){ collect(d); drops.splice(i, 1); continue; }
    if(--d.life <= 0 || d.y > VH + 40) drops.splice(i, 1);
  }
}

function collect(d){
  const p = player, D = DROPS[d.type];
  spark(d.x, d.y, 16, D.c, 3.4, 22, 2);
  shockwave(d.x, d.y, 44, D.c, 2.5, 16);
  let msg = D.label;
  switch(d.type){
    case 'vulcan': case 'laser': case 'plasma':
      if(p.weapon === d.type){
        if(p.level < 5){ p.level++; msg = D.label + ' Nv.' + p.level; SND.levelup(); }
        else { msg = 'BONUS +2000'; addScore(2000, 0); SND.pickup(); }
      } else { p.weapon = d.type; msg = D.label; SND.levelup(); }
      break;
    case 'option':
      if(p.options < 2){ p.options++; msg = 'DRONE x' + p.options; SND.levelup(); }
      else { msg = 'BONUS +1500'; addScore(1500, 0); SND.pickup(); }
      break;
    case 'shield':
      p.shield = Math.min(3, p.shield + 1); msg = 'BOUCLIER x' + p.shield; SND.pickup(); break;
    case 'repair':
      p.hp = Math.min(p.maxHp, p.hp + 45); SND.pickup(); break;
    case 'energy':
      p.energy = Math.min(p.maxEnergy, p.energy + 40); SND.pickup(); break;
    case 'bonus':
      addScore(1200, 0); msg = '+1200'; SND.pickup(); break;
  }
  floater(d.x, d.y - 16, msg, D.c, 14);
}

function drawDrops(){
  for(const d of drops){
    const D = DROPS[d.type];
    const bob = Math.sin(d.t * 0.09) * 3;
    const pulse = 0.75 + Math.sin(d.t * 0.15) * 0.25;
    const fade = d.life < 120 ? (d.life % 20 < 10 ? 0.35 : 1) : 1;
    ctx.globalAlpha = fade;
    glow(d.x, d.y + bob, 24 * pulse, D.c, 0.6);
    ctx.save();
    ctx.translate(d.x, d.y + bob);
    ctx.rotate(Math.sin(d.t * 0.05) * 0.25);
    ctx.fillStyle = 'rgba(8,10,26,0.92)';
    ctx.strokeStyle = D.c; ctx.lineWidth = 2;
    roundRect(-12, -12, 24, 24, 6);
    ctx.fill(); ctx.stroke();
    txt(D.tag, 0, 1, 15, D.c, 'center', 'bold', 6);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

let foes = [];

const FOE_TYPES = {
  drone: { hp:18, r:15, score:120, c:'#4fa8ff', a:'#0d2450',
    init(e){ e.vy = e.opt.vy || 1.9; e.wob = rnd(0, TAU); e.fireT = rndi(40, 100); },
    ai(e){
      e.y += e.vy; e.x += Math.sin(e.t * 0.045 + e.wob) * 0.9;
      if(e.y > 30 && --e.fireT <= 0){
        e.fireT = 110;
        ebullet(e.x, e.y + 12, aim(e.x, e.y, player.x, player.y), 3.1, { r:6, c:'#ff4d6d' });
      }
    }},
  weaver: { hp:26, r:16, score:180, c:'#ff7ad9', a:'#4a0c3a',
    init(e){ e.vy = 1.1; e.wob = rnd(0, TAU); e.fireT = rndi(50, 90); e.amp = rnd(2.4, 3.6); },
    ai(e){
      e.y += e.vy; e.x += Math.sin(e.t * 0.05 + e.wob) * e.amp;
      if(e.y > 40 && --e.fireT <= 0){
        e.fireT = 95;
        const a = aim(e.x, e.y, player.x, player.y);
        for(let i = -1; i <= 1; i++) ebullet(e.x, e.y + 10, a + i * 0.22, 2.9, { r:5.5, c:'#ff6bd6' });

    }},

    init(e){ e.vy = 2.4; e.stopY = rnd(140, 300); e.mode = 0; e.wait = 46; },
    ai(e){
      if(e.mode === 0){
        e.y += e.vy;
        if(e.y >= e.stopY){ e.mode = 1; }
      } else if(e.mode === 1){
        if(--e.wait <= 0){
          e.mode = 2;
          e.da = aim(e.x, e.y, player.x, player.y);
          spark(e.x, e.y, 10, '#ffd08a', 3, 16, 2);

        if(gameFrame % 2 === 0)
          addPart({ k:'spark', x:e.x, y:e.y, vx:0, vy:0, life:12, max:12, c:'#ffb03a', sz:3, drag:0.9, grav:0 });
      }
    }},
  turret: { hp:105, r:23, score:520, c:'#8f9dff', a:'#171b4a',
    init(e){ e.vy = 1.6; e.stopY = e.opt.stopY || rnd(110, 230); e.fireT = 70; e.drift = rsign() * 0.7; },
    ai(e){
      if(e.y < e.stopY) e.y += e.vy;
      else { e.x += e.drift; if(e.x < 40 || e.x > VW - 40) e.drift *= -1; e.life2 = (e.life2 || 0) + 1; }
      if(e.y >= e.stopY && --e.fireT <= 0){
        e.fireT = 100;
        const base = aim(e.x, e.y, player.x, player.y);
        for(let i = -2; i <= 2; i++) ebullet(e.x, e.y + 14, base + i * 0.19, 2.7, { r:6.5, c:'#9aa8ff', kind:'shard' });
      }
      if(e.life2 > 620) e.y += 2.2;
    }},
  orbiter: { hp:70, r:19, score:420, c:'#54ffd0', a:'#053a34',
    init(e){ e.cx = e.x; e.cy = e.opt.cy || rnd(150, 280); e.rad = 0; e.mode = 0; e.fireT = 90; e.oa = rnd(0, TAU); },
    ai(e){
      if(e.mode === 0){
        e.y += 2.1;
        if(e.y >= e.cy){ e.mode = 1; }
      } else {
        e.oa += 0.035; e.rad = Math.min(e.rad + 0.9, 74);
        e.x = e.cx + Math.cos(e.oa) * e.rad;
        e.y = e.cy + Math.sin(e.oa) * e.rad * 0.45;
        if(--e.fireT <= 0){
          e.fireT = 125;
          const off = rnd(0, TAU);
          for(let i = 0; i < 9; i++) ebullet(e.x, e.y, off + i / 9 * TAU, 2.3, { r:5.5, c:'#54ffd0' });
        }
      }
    }},
  mine: { hp:34, r:17, score:260, c:'#ff5ce1', a:'#3d0a35',
    init(e){ e.vy = rnd(0.7, 1.2); e.wob = rnd(0, TAU); },
    ai(e){ e.y += e.vy; e.x += Math.sin(e.t * 0.03 + e.wob) * 0.6; },
    onDeath(e){
      for(let i = 0; i < 12; i++) ebullet(e.x, e.y, i / 12 * TAU + e.t * 0.02, 2.5, { r:5, c:'#ff5ce1' });
    }},
  sniper: { hp:30, r:14, score:340, c:'#ff4d4d', a:'#4a0505',
    init(e){ e.dirx = e.opt.dirx || 1; e.vx = e.dirx * 7.5; e.fireT = 46; e.stopped = 0; },
    ai(e){
      e.x += e.vx; e.y += 0.35;
      e.vx *= 0.965;
      if(--e.fireT <= 0 && e.stopped < 2){
        e.stopped++;
        e.fireT = 34;
        const a = aim(e.x, e.y, player.x, player.y);
        ebullet(e.x, e.y, a, 6.4, { r:5, c:'#ff4d4d', kind:'needle' });
        coneSpark(e.x, e.y, 5, a, 0.3, '#ff8080', 3, 12);
      }
      if(e.stopped >= 2) e.vx += e.dirx * 0.22;
    }},
  carrier: { hp:520, r:44, rx:52, ry:32, score:3000, c:'#c9a0ff', a:'#2a0d4a', big:1,
    init(e){ e.stopY = 150; e.fireT = 90; e.spawnT = 150; e.drift = rsign() * 1.1; },
    ai(e){
      if(e.y < e.stopY) e.y += 1.5;
      else { e.x += e.drift; if(e.x < 70 || e.x > VW - 70) e.drift *= -1; }
      if(e.y < e.stopY) return;
      if(--e.fireT <= 0){
        e.fireT = 84;
        const a = aim(e.x, e.y, player.x, player.y);
        for(let i = -2; i <= 2; i++) ebullet(e.x, e.y + 20, a + i * 0.15, 3.2, { r:6, c:'#c9a0ff' });
      }
      if(--e.spawnT <= 0){
        e.spawnT = 190;
        for(const s of [-1, 1]) spawnFoe('drone', e.x + s * 40, e.y + 14, { vy:2.4 });
        spark(e.x, e.y + 14, 10, '#c9a0ff', 3, 16, 2);
      }
    }}
};

function spawnFoe(kind, x, y, opt){
  const T = FOE_TYPES[kind];
  const mul = 1 + dirState.stage * 0.34;
  const e = {
    kind:kind, x:x, y:y, t:0, vx:0, vy:0, opt: opt || {},
    hp: Math.round(T.hp * mul * ((opt && opt.hpMul) || 1)),
    maxHp: 0, r: T.r, rx: T.rx || T.r, ry: T.ry || T.r,
    score: T.score, c: T.c, a: T.a, big: T.big || 0,
    hitT: 0, dead: 0, T: T, id: ++foeId
  };
  e.maxHp = e.hp;
  if(T.init) T.init(e);
  foes.push(e);
  return e;
}
let foeId = 0;

function updateFoes(){
  for(let i = foes.length - 1; i >= 0; i--){
    const e = foes[i];
    e.t++;
    if(e.hitT > 0) e.hitT--;
    e.T.ai(e);
    const m = e.big ? 90 : 46;
    if(e.y > VH + m || e.x < -m - 40 || e.x > VW + m + 40 || (e.y < -260 && e.t > 120)){
      foes.splice(i, 1);
      continue;
    }
  }
}

function killFoe(e, idx){
  e.dead = 1;
  if(e.T.onDeath) e.T.onDeath(e);
  explode(e.x, e.y, e.big ? 2.4 : (e.r > 20 ? 1.2 : 0.8), e.c);
  addScore(e.score, 1);
  bumpCombo();
  stats.kills++;
  if(e.big){
    for(let i = 0; i < 4; i++) after(i * 7, () => explode(e.x + rnd(-40,40), e.y + rnd(-24,24), 1.4, e.c));
    spawnDrop(e.x - 24, e.y, 'option');
    spawnDrop(e.x + 24, e.y, pick(['vulcan','laser','plasma']));
    spawnDrop(e.x, e.y, 'shield');
    freeze(5); shake(14);
  } else if(Math.random() < 0.115){
    spawnDrop(e.x, e.y);
  }
  const k = foes.indexOf(e);
  if(k >= 0) foes.splice(k, 1);
}

/* ---- rendu des ennemis ---- */
function drawFoes(){
  for(const e of foes){
    ctx.save();
    ctx.translate(e.x, e.y);
    glow(0, 0, e.r * 1.9, e.c, 0.30);
    const flash = e.hitT > 0 ? 1 : 0;
    ctx.strokeStyle = flash ? '#ffffff' : e.c;
    ctx.lineWidth = 1.6;
    const body = flash ? '#ffffff' : e.a;

    switch(e.kind){
      case 'drone': {
        ctx.rotate(Math.sin(e.t * 0.04) * 0.12);
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.moveTo(0, 15); ctx.lineTo(-15, -6); ctx.lineTo(-6, -12); ctx.lineTo(6, -12); ctx.lineTo(15, -6);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = flash ? '#fff' : e.c;
        ctx.beginPath(); ctx.arc(0, -1, 4, 0, TAU); ctx.fill();
        break;
      }
      case 'weaver': {
        ctx.rotate(clamp(Math.cos(e.t * 0.05 + e.wob) * 0.5, -0.6, 0.6));
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.moveTo(0, 16); ctx.lineTo(-18, -2); ctx.lineTo(-8, -14); ctx.lineTo(8, -14); ctx.lineTo(18, -2);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = flash ? '#fff' : e.c;
        ctx.fillRect(-3, -8, 6, 14);
        break;
      }
      case 'diver': {
        const charging = e.mode === 1;
        ctx.rotate(e.mode === 2 ? e.da - Math.PI/2 : 0);
        if(charging && (e.t >> 2) % 2 === 0) glow(0, 0, 34, '#ffe0a0', 0.5);
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.moveTo(0, 18); ctx.lineTo(-11, -4); ctx.lineTo(0, -16); ctx.lineTo(11, -4);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = flash ? '#fff' : '#ffe6b0';
        ctx.beginPath(); ctx.arc(0, 2, 3.4, 0, TAU); ctx.fill();
        break;
      }
      case 'turret': {
        ctx.fillStyle = body;
        ctx.beginPath();
        for(let i = 0; i < 6; i++){
          const a = i / 6 * TAU + Math.PI / 6;
          const px = Math.cos(a) * 22, py = Math.sin(a) * 20;
          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = flash ? '#fff' : e.c;
        ctx.fillRect(-5, 8, 10, 14);
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
        ctx.fillStyle = '#0b0f2e';
        ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, TAU); ctx.fill();
        break;
      }
      case 'orbiter': {
        ctx.rotate(e.t * 0.05);
        ctx.strokeStyle = flash ? '#fff' : e.c; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 17, 0.4, Math.PI - 0.4); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 17, Math.PI + 0.4, TAU - 0.4); ctx.stroke();
        ctx.fillStyle = flash ? '#fff' : e.a;
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
        ctx.fillStyle = flash ? '#fff' : e.c;
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
        break;
      }
      case 'mine': {
        ctx.rotate(e.t * 0.02);
        ctx.strokeStyle = flash ? '#fff' : e.c; ctx.lineWidth = 2.4;
        for(let i = 0; i < 8; i++){
          const a = i / 8 * TAU;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 10, Math.sin(a) * 10);
          ctx.lineTo(Math.cos(a) * 19, Math.sin(a) * 19);
          ctx.stroke();
        }
        ctx.fillStyle = flash ? '#fff' : e.a;
        ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill();
        const pl = 0.6 + Math.sin(e.t * 0.18) * 0.4;
        ctx.fillStyle = flash ? '#fff' : e.c;
        ctx.globalAlpha = pl;
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
        break;
      }
      case 'sniper': {
        ctx.rotate(e.dirx > 0 ? 0.35 : -0.35);
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.moveTo(0, 16); ctx.lineTo(-7, -14); ctx.lineTo(0, -18); ctx.lineTo(7, -14);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = flash ? '#fff' : e.c;
        ctx.fillRect(-11, 0, 22, 3.5);
        break;
      }
      case 'carrier': {
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.moveTo(0, 30); ctx.lineTo(-34, 16); ctx.lineTo(-52, -6); ctx.lineTo(-30, -22);
        ctx.lineTo(30, -22); ctx.lineTo(52, -6); ctx.lineTo(34, 16);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = flash ? '#fff' : e.c;
        ctx.fillRect(-40, -4, 16, 9); ctx.fillRect(24, -4, 16, 9);
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
        ctx.fillStyle = '#12082a';
        ctx.beginPath(); ctx.arc(0, 0, 6 + Math.sin(e.t * 0.1) * 1.5, 0, TAU); ctx.fill();
        break;
      }
    }
    ctx.restore();

    if(e.big || e.hp < e.maxHp){
      const w = e.big ? 90 : 30, hp = e.hp / e.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - w/2, e.y - (e.big ? 42 : e.r + 11), w, e.big ? 5 : 3);
      ctx.fillStyle = hp > 0.5 ? '#5cff9d' : (hp > 0.22 ? '#ffcc3a' : '#ff4d6d');
      ctx.fillRect(e.x - w/2, e.y - (e.big ? 42 : e.r + 11), w * hp, e.big ? 5 : 3);
    }
  }
}

/* ---------------------------------------------------------------
   12. RAYONS (lasers de boss)
   --------------------------------------------------------------- */
let beams = [];

function addBeam(o){
  beams.push({
    src:o.src || null, ox:o.ox || 0, oy:o.oy || 0,
    x:o.x || 0, y:o.y || 0, ang:o.ang, rot:o.rot || 0,
    warn:o.warn === undefined ? 52 : o.warn, fire:o.fire === undefined ? 110 : o.fire,
    w:o.w || 26, c:o.c || '#ff4d6d', hitT:0
  });
}

function updateBeams(){
  const p = player;
  for(let i = beams.length - 1; i >= 0; i--){
    const b = beams[i];
    if(b.src){
      if(b.src.dead || b.src.gone){ beams.splice(i, 1); continue; }
      b.x = b.src.x + b.ox; b.y = b.src.y + b.oy;
    }
    b.ang += b.rot;
    if(b.warn > 0){ b.warn--; if(b.warn === 0){ shake(4); SND.shot('laser'); } }
    else {
      b.fire--;
      if(b.hitT > 0) b.hitT--;
      // impact visuel
      if(gameFrame % 2 === 0){
        const d = rnd(40, 900);
        addPart({ k:'spark', x:b.x + Math.cos(b.ang)*d, y:b.y + Math.sin(b.ang)*d,
                  vx:rnd(-2,2), vy:rnd(-2,2), life:10, max:10, c:b.c, sz:2, drag:0.9, grav:0 });
      }
      // collision joueur (distance point-droite)
      if(!p.dead && b.hitT <= 0 && state === 'play'){
        const dx = p.x - b.x, dy = p.y - b.y;
        const proj = dx * Math.cos(b.ang) + dy * Math.sin(b.ang);
        if(proj > 0){
          const perp = Math.abs(-dx * Math.sin(b.ang) + dy * Math.cos(b.ang));
          if(perp < b.w * 0.42 + p.r){ hurtPlayer(26, p.x, p.y); b.hitT = 26; }
        }
      }
      if(b.fire <= 0) beams.splice(i, 1);
    }
  }
}

function drawBeams(){
  for(const b of beams){
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.ang);
    if(b.warn > 0){
      const a = 0.25 + Math.sin(gameFrame * 0.5) * 0.2;
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba(b.c, a);
      ctx.lineWidth = 2.5;
      ctx.setLineDash([16, 12]);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1100, 0); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalCompositeOperation = 'source-over';
    } else {
      const grow = clamp((110 - b.fire) / 8, 0, 1) * clamp(b.fire / 10, 0, 1);
      const w = b.w * (0.6 + grow * 0.4) * (0.92 + Math.sin(gameFrame * 0.7) * 0.08);
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(0, -w, 0, w);
      g.addColorStop(0, rgba(b.c, 0)); g.addColorStop(0.34, rgba(b.c, 0.55));
      g.addColorStop(0.5, '#ffffff'); g.addColorStop(0.66, rgba(b.c, 0.55));
      g.addColorStop(1, rgba(b.c, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, -w, 1100, w * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, -w * 0.16, 1100, w * 0.32);
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
      glow(b.x, b.y, w * 2.4, b.c, 0.75);
      continue;
    }
    ctx.restore();
  }
}

let boss = null;

const ATK = {
  idle(){},
  fan(b, t, p){
    if(t % p.rate) return;
    const n = p.n, base = p.aimed ? aim(b.x, b.y + 20, player.x, player.y) : Math.PI/2;
    for(let i = 0; i < n; i++){
      const a = base + (n === 1 ? 0 : (i / (n - 1) - 0.5) * 2 * p.spread);
      ebullet(b.x, b.y + 24, a, p.spd, { r:p.r || 7, c:p.c || b.c, kind:p.kind || 'orb' });
    }
    coneSpark(b.x, b.y + 24, 4, Math.PI/2, 0.6, b.c, 2.5, 10);
  },
  aimed(b, t, p){
    if(t % p.rate) return;
    const base = aim(b.x, b.y + 20, player.x, player.y);
    const n = p.n;
    for(let i = 0; i < n; i++){
      const a = base + (n === 1 ? 0 : (i / (n - 1) - 0.5) * 2 * p.spread);
      ebullet(b.x, b.y + 20, a, p.spd, { r:5.5, c:p.c || '#ff8b5e', kind:'needle' });
    }
  },
  spiral(b, t, p){
    if(t % p.rate) return;
    b.spin = (b.spin || 0) + p.turn;
    for(let i = 0; i < p.arms; i++){
      const a = b.spin + i / p.arms * TAU;
      ebullet(b.x, b.y, a, p.spd, { r:p.r || 6, c:p.c || '#ff5ce1', kind:p.kind || 'orb' });
    }
  },
  ring(b, t, p){
    if(t % p.rate) return;
    const n = p.n, gapDir = p.aimed ? aim(b.x, b.y, player.x, player.y) : rnd(0, TAU);
    const gap = p.gap === undefined ? 0.55 : p.gap;
    for(let i = 0; i < n; i++){
      const a = i / n * TAU + b.t * 0.01;
      let d = a - gapDir;
      while(d > Math.PI) d -= TAU;
      while(d < -Math.PI) d += TAU;
      if(Math.abs(d) < gap) continue;
      ebullet(b.x, b.y, a, p.spd, { r:6.5, c:p.c || '#ffb03a', kind:'shard' });
    }
    shockwave(b.x, b.y, 90, p.c || '#ffb03a', 3, 18);
  },
  wall(b, t, p){
    if(t % p.rate) return;
    const cols = 13, gap = rndi(1, cols - 2);
    for(let i = 0; i < cols; i++){
      if(i === gap || i === gap + 1) continue;
      ebullet((i + 0.5) / cols * VW, -12, Math.PI/2, p.spd, { r:7, c:p.c || '#ff4d6d' });
    }
  },
  rain(b, t, p){
    if(t % p.rate) return;
    for(let i = 0; i < (p.n || 2); i++)
      ebullet(rnd(20, VW - 20), -12, Math.PI/2 + rnd(-0.25, 0.25), p.spd, { r:6, c:p.c || '#ff7ad9' });
  },
  missiles(b, t, p){
    if(t % p.rate) return;
    for(let i = 0; i < (p.n || 2); i++){
      const a = Math.PI/2 + (i - ((p.n || 2) - 1) / 2) * 0.9;
      ebullet(b.x + (i - 0.5) * 40, b.y + 16, a, p.spd || 2.2,
              { r:7, c:'#ff9d3a', kind:'needle', homing:0.035, life:400 });
    }
  },
  mines(b, t, p){
    if(t % p.rate) return;
    ebullet(b.x, b.y + 20, Math.PI/2 + rnd(-0.9, 0.9), p.spd || 1.6,
            { r:9, c:'#ff5ce1', fuse:p.fuse || 110, life:400 });
  },
  summon(b, t, p){
    if(t % p.rate) return;
    for(let i = 0; i < (p.n || 2); i++){
      const x = b.x + (i - ((p.n || 2) - 1) / 2) * 70;
      spawnFoe(p.kind || 'drone', clamp(x, 40, VW - 40), b.y, { vy:2.2 });
      spark(x, b.y, 8, b.c, 3, 14, 2);
    }
  },
  flower(b, t, p){
    if(t % p.rate) return;
    b.spin = (b.spin || 0) + (p.turn || 0.24);
    const n = p.n || 10;
    for(let layer = 0; layer < (p.layers || 2); layer++){
      for(let i = 0; i < n; i++){
        const a = b.spin * (layer % 2 ? -1 : 1) + i / n * TAU;
        ebullet(b.x, b.y, a, (p.spd || 2.2) + layer * 0.6,
                { r:6, c:layer % 2 ? '#ffe14a' : (p.c || '#ff5ce1'), kind:'shard' });
      }
    }
  },
  laser(b, t, p){
    if(t !== 0) return;
    const n = p.n || 1;
    for(let i = 0; i < n; i++){
      const base = p.aimed ? aim(b.x, b.y, player.x, player.y) : (p.ang === undefined ? Math.PI/2 : p.ang);
      addBeam({ src:b, ox:(p.spread || 0) * (n === 1 ? 0 : (i / (n - 1) - 0.5) * 2), oy:10,
                ang: base + (n === 1 ? 0 : (i / (n - 1) - 0.5) * (p.arc || 0)) + (p.spin ? i / n * TAU : 0),
                rot: (p.rot || 0) * (p.mirror && i % 2 ? -1 : 1),
                warn:p.warn || 52, fire:p.fire || 120, w:p.w || 26, c:p.c || b.c });
    }
  },
  dash(b, t, p){
    if(t === 0){ b.dashX = clamp(player.x, 70, VW - 70); b.dashY = b.entryY; }
    if(t < 26){ b.x = lerp(b.x, b.dashX, 0.12); }
    else if(t < 26 + 34){
      b.y = lerp(b.y, VH * 0.62, 0.22);
      if(t % 4 === 0) spark(b.x, b.y, 6, b.c, 3, 14, 2);
      if(t % 8 === 0) ebullet(b.x, b.y, Math.PI/2 + rnd(-0.6,0.6), 2.6, { r:6, c:b.c });
    } else {
      b.y = lerp(b.y, b.entryY, 0.07);
    }
  },
  blink(b, t, p){
    const per = p.rate || 90;
    const k = t % per;
    if(k === per - 18){
      spark(b.x, b.y, 24, b.c, 5, 20, 2);
      shockwave(b.x, b.y, 90, b.c, 3, 18);
      b.ghost = 1;
    }
    if(k === 0 && t > 0){
      b.x = rnd(b.rx * 1.1, VW - b.rx * 1.1); b.y = rnd(b.entryY - 30, b.entryY + 90);
      b.ghost = 0;
      spark(b.x, b.y, 26, '#ffffff', 5, 20, 2);
      const n = p.n || 14;
      for(let i = 0; i < n; i++) ebullet(b.x, b.y, i / n * TAU + rnd(0, 0.4), p.spd || 2.4, { r:6, c:b.c });
    }
  },
  sweepShot(b, t, p){
    if(t % p.rate) return;
    const a = Math.PI/2 + Math.sin(t * (p.freq || 0.05)) * (p.arc || 0.8);
    for(let i = 0; i < (p.n || 3); i++)
      ebullet(b.x, b.y + 20, a + i * 0.09 - 0.09, p.spd, { r:6, c:p.c || '#ff4d6d', kind:'orb' });
  }
};

function spawnBoss(idx){
  const D = BOSSES[idx];
  boss = {
    def:D, name:D.name, title:D.title, c:D.c, c2:D.c2, shape:D.shape,
    hp:D.hp, maxHp:D.hp, x:VW/2, y:-150, rx:D.rx, ry:D.ry, entryY:D.entryY,
    t:0, phase:0, atk:0, atkT:0, hitT:0, dead:0, gone:0, entering:1, invul:1,
    spin:0, ghost:0, score:D.score, sway:0,
    pods: (D.pods || []).map(p => ({ ox:p.ox, oy:p.oy, hp:p.hp, maxHp:p.hp, dead:0, hitT:0 }))
  };
  bossActive = true;
}

function bossPhase(){ return boss.def.phases[boss.phase]; }

function updateBoss(){
  const b = boss;
  if(!b || b.dead) return;
  b.t++;
  if(b.hitT > 0) b.hitT--;

  if(b.entering){
    b.y = lerp(b.y, b.entryY, 0.045);
    if(b.y > b.entryY - 3){ b.entering = 0; b.invul = 0; b.y = b.entryY; }
    return;
  }

  const ph = bossPhase();
  const entry = ph.script[b.atk];
  /* déplacement de base : balancier — sauf si l'attaque pilote le boss */
  const manual = entry.a === 'dash' || entry.a === 'blink';
  b.sway += ph.speed;
  if(!manual){
    const range = Math.min(ph.range, VW/2 - b.rx * 1.15);
    b.x = lerp(b.x, VW/2 + Math.sin(b.sway) * range, 0.2);
    b.y = lerp(b.y, b.entryY + Math.sin(b.sway * 1.7) * 14, 0.2);
  }

  /* script d'attaques */
  ATK[entry.a](b, b.atkT, entry.p || {});
  b.x = clamp(b.x, b.rx * 1.1, VW - b.rx * 1.1);
  if(++b.atkT >= entry.d){
    b.atkT = 0;
    b.atk = (b.atk + 1) % ph.script.length;
    b.ghost = 0;
  }

  /* tourelles */
  for(const pod of b.pods){
    if(pod.dead) continue;
    if(pod.hitT > 0) pod.hitT--;
    pod.fireT = (pod.fireT || rndi(30, 90)) - 1;
    if(pod.fireT <= 0){
      pod.fireT = 78;
      const px = b.x + pod.ox, py = b.y + pod.oy;
      ebullet(px, py, aim(px, py, player.x, player.y), 3.6, { r:5.5, c:'#ffd08a', kind:'needle' });
    }
  }

  /* fumée quand le boss est mal en point */
  const frac = b.hp / b.maxHp;
  if(frac < 0.45 && gameFrame % 6 === 0){
    smoke(b.x + rnd(-b.rx*0.6, b.rx*0.6), b.y + rnd(-10, 20), 1, '#ff7a3a', 0.6, 40, 12);
  }
  if(frac < 0.2 && gameFrame % 22 === 0){
    explode(b.x + rnd(-b.rx*0.7, b.rx*0.7), b.y + rnd(-20, 20), 0.6, b.c);
  }
}

function bossCheckPhase(){
  const b = boss;
  const ph = bossPhase();
  if(b.hp / b.maxHp <= ph.to && b.phase < b.def.phases.length - 1){
    b.phase++; b.atk = 0; b.atkT = 0;
    b.invul = 1;
    after(45, () => { if(boss === b) b.invul = 0; });
    beams.length = 0;
    clearBulletsAround(b.x, b.y, 2000);
    flash(b.c, 0.4); shake(14); freeze(6);
    shockwave(b.x, b.y, 340, b.c, 9, 40);
    shockwave(b.x, b.y, 200, '#ffffff', 5, 30);
    spark(b.x, b.y, 50, b.c, 7, 40, 3);
    floater(b.x, b.y - 60, 'PHASE ' + (b.phase + 1), b.c2, 22);
    SND.alarm();
    if(b.def.final && b.phase === b.def.phases.length - 1){
      SND.setMood('final');
      toast('SURCHARGE CRITIQUE');
    }
  }
}

function killBoss(){
  const b = boss;
  b.dead = 1;
  bossActive = false;
  beams.length = 0;
  SND.bossDown();
  slowmo(0.25, 130); freeze(14); shake(24);
  addScore(b.score, 1);
  stats.bosses++;
  for(let i = 0; i < 26; i++){
    after(i * 6, () => {
      explode(b.x + rnd(-b.rx, b.rx), b.y + rnd(-b.ry, b.ry), rnd(0.9, 2.2), i % 3 ? b.c : '#ffffff');
      if(i % 4 === 0) shake(12);
    });
  }
  after(150, () => {
    flash('#ffffff', 0.9);
    shockwave(b.x, b.y, 900, b.c, 16, 60);
    shockwave(b.x, b.y, 620, '#ffffff', 9, 46);
    clearBulletsAround(b.x, b.y, 3000);
    b.gone = 1;
    for(let i = 0; i < 5; i++) spawnDrop(b.x + rnd(-60, 60), b.y + rnd(-20, 20));
    stageClear();
  });
}

/* ---- rendu du boss ---- */
function drawBoss(){
  const b = boss;
  if(!b || b.gone) return;
  const flashOn = b.hitT > 0;
  ctx.save();
  ctx.translate(b.x, b.y);
  if(b.ghost) ctx.globalAlpha = 0.35;

  glow(0, 0, b.rx * 1.8, b.c, 0.34);
  const main = ctx.createLinearGradient(0, -b.ry * 1.1, 0, b.ry * 1.1);
  main.addColorStop(0, shade(b.c, flashOn ? 20 : -55));
  main.addColorStop(0.5, shade(b.c, flashOn ? -35 : -105));
  main.addColorStop(1, shade(b.c, flashOn ? -60 : -135));
  const line = flashOn ? '#ffffff' : b.c;
  ctx.strokeStyle = line; ctx.lineWidth = 2.4;
  ctx.fillStyle = main;

  if(b.shape === 'scout'){
    ctx.beginPath();
    ctx.moveTo(0, b.ry + 14);
    ctx.lineTo(-b.rx * 0.42, b.ry * 0.3);
    ctx.lineTo(-b.rx, -b.ry * 0.2);
    ctx.lineTo(-b.rx * 0.55, -b.ry);
    ctx.lineTo(b.rx * 0.55, -b.ry);
    ctx.lineTo(b.rx, -b.ry * 0.2);
    ctx.lineTo(b.rx * 0.42, b.ry * 0.3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = line;
    for(const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(s * b.rx * 0.5, -b.ry * 0.7);
      ctx.lineTo(s * b.rx * 0.95, b.ry * 0.1);
      ctx.lineTo(s * b.rx * 0.5, b.ry * 0.1);
      ctx.closePath(); ctx.fill();
    }
  } else if(b.shape === 'destroyer'){
    ctx.beginPath();
    ctx.moveTo(0, b.ry + 10);
    ctx.lineTo(-b.rx * 0.55, b.ry * 0.6);
    ctx.lineTo(-b.rx * 0.95, -b.ry * 0.1);
    ctx.lineTo(-b.rx * 0.6, -b.ry);
    ctx.lineTo(b.rx * 0.6, -b.ry);
    ctx.lineTo(b.rx * 0.95, -b.ry * 0.1);
    ctx.lineTo(b.rx * 0.55, b.ry * 0.6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = flashOn ? '#fff' : shade(b.c, -60);
    ctx.fillRect(-b.rx * 0.75, -b.ry * 0.35, b.rx * 1.5, 12);
    ctx.fillStyle = line;
    for(let i = -2; i <= 2; i++){
      ctx.beginPath(); ctx.arc(i * 26, b.ry * 0.35, 5, 0, TAU); ctx.fill();
    }
  } else if(b.shape === 'titan'){
    ctx.save();
    ctx.rotate(b.t * 0.006);
    ctx.strokeStyle = rgba(b.c, 0.5); ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, 0, b.rx * 1.22, 0.3, 2.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, b.rx * 1.22, Math.PI + 0.3, Math.PI + 2.2); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = main; ctx.strokeStyle = line; ctx.lineWidth = 2.4;
    ctx.beginPath();
    for(let i = 0; i < 6; i++){
      const a = i / 6 * TAU + Math.PI / 6;
      const px = Math.cos(a) * b.rx, py = Math.sin(a) * b.ry;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = flashOn ? '#fff' : shade(b.c, -50);
    ctx.beginPath();
    for(let i = 0; i < 6; i++){
      const a = i / 6 * TAU + Math.PI / 6;
      const px = Math.cos(a) * b.rx * 0.6, py = Math.sin(a) * b.ry * 0.6;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  } else if(b.shape === 'omega'){
    ctx.save();
    ctx.rotate(-b.t * 0.012);
    ctx.strokeStyle = rgba(b.c, 0.55); ctx.lineWidth = 4;
    for(let i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.arc(0, 0, b.rx * (0.75 + i * 0.22), i * 1.1, i * 1.1 + 2.6);
      ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.rotate(b.t * 0.02);
    ctx.fillStyle = main; ctx.strokeStyle = line; ctx.lineWidth = 2.4;
    ctx.beginPath();
    for(let i = 0; i < 12; i++){
      const a = i / 12 * TAU;
      const r = i % 2 ? b.rx * 0.46 : b.rx * 0.82;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  } else {
    /* FINAL-Ω */
    ctx.save();
    ctx.rotate(b.t * 0.008);
    for(let k = 0; k < 3; k++){
      ctx.strokeStyle = rgba(k % 2 ? '#ff5ce1' : b.c, 0.5);
      ctx.lineWidth = 4 - k;
      ctx.beginPath();
      ctx.ellipse(0, 0, b.rx * (0.8 + k * 0.2), b.ry * (0.9 + k * 0.3), k * 0.7 + b.t * 0.01, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = main; ctx.strokeStyle = line; ctx.lineWidth = 2.6;
    ctx.beginPath();
    for(let i = 0; i < 16; i++){
      const a = i / 16 * TAU - Math.PI/2;
      const r = i % 4 === 0 ? 1.06 : (i % 2 === 0 ? 0.86 : 0.62);
      const px = Math.cos(a) * b.rx * r, py = Math.sin(a) * b.ry * r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  /* noyau lumineux */
  const pulse = 1 + Math.sin(b.t * 0.09) * 0.16;
  glow(0, -b.ry * 0.08, 34 * pulse, b.c2, 0.85);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, -b.ry * 0.08, 12 * pulse, 0, TAU); ctx.fill();
  ctx.fillStyle = b.c;
  ctx.beginPath(); ctx.arc(0, -b.ry * 0.08, 6 * pulse, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  /* tourelles */
  for(const pod of b.pods){
    if(pod.dead) continue;
    const px = b.x + pod.ox, py = b.y + pod.oy;
    glow(px, py, 30, '#ffd08a', 0.4);
    ctx.save(); ctx.translate(px, py);
    ctx.fillStyle = pod.hitT > 0 ? '#ffffff' : shade(b.c, -70);
    ctx.strokeStyle = pod.hitT > 0 ? '#ffffff' : '#ffd08a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd08a';
    ctx.fillRect(-4, 12, 8, 12);
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(px - 20, py - 30, 40, 4);
    ctx.fillStyle = '#ffd08a';
    ctx.fillRect(px - 20, py - 30, 40 * (pod.hp / pod.maxHp), 4);
  }
}

const dirState = { stage:0, wave:0, timer:0, phase:'brief', phaseT:0, noDeath:true };
let bossActive = false, bulletSpeed = 1;

function spawnWave(w){
  const kind = w[1], n = w[2], form = w[3], o = w[4] || {};
  for(let i = 0; i < n; i++){
    let x = VW / 2, y = -42, wait = 0;
    switch(form){
      case 'line':   x = VW * (i + 1) / (n + 1); break;
      case 'arc':    x = VW * (i + 1) / (n + 1); y = -42 - Math.sin((i + 1) / (n + 1) * Math.PI) * 72; break;
      case 'vee':    x = VW * (i + 1) / (n + 1); y = -42 - Math.abs(i - (n - 1) / 2) * 34; break;
      case 'stream': x = o.x === undefined ? VW / 2 : o.x; wait = i * (o.step || 16); break;
      case 'rain':   x = rnd(46, VW - 46); wait = i * (o.step || 18); break;
      case 'diag':   x = 50 + (VW - 100) * (n === 1 ? 0.5 : i / (n - 1)); y = -42 - i * 34; break;
      case 'sideL':  x = -34; y = 100 + i * 52; wait = i * (o.step || 12); break;
      case 'sideR':  x = VW + 34; y = 100 + i * 52; wait = i * (o.step || 12); break;
      case 'center': x = o.x === undefined ? VW / 2 : o.x; y = -70; break;
    }
    const fx = x, fy = y;
    if(wait) after(wait, () => { if(state === 'play') spawnFoe(kind, fx, fy, o); });
    else spawnFoe(kind, fx, fy, o);
  }
}

function startStage(i){
  dirState.stage = i;
  dirState.wave = 0;
  dirState.phase = 'brief';
  dirState.phaseT = 170;
  dirState.noDeath = true;
  bulletSpeed = 1 + i * 0.07;
  BG.applyStage(i);
  SND.setMood('stage');
  BG.boost = 1.6;
}

function updateDirector(){
  const d = dirState, S = STAGES[d.stage];
  switch(d.phase){
    case 'brief':
      if(--d.phaseT <= 0){
        d.phase = 'waves';
        d.timer = S.waves[0][0];
      }
      break;
    case 'waves': {
      if(--d.timer <= 0){
        while(d.timer <= 0 && d.wave < S.waves.length){
          spawnWave(S.waves[d.wave]);
          d.wave++;
          d.timer = d.wave < S.waves.length ? S.waves[d.wave][0] : 99999;
        }
      }
      if(d.wave >= S.waves.length && foes.length === 0 && timers.length === 0){
        d.phase = 'warn'; d.phaseT = 165;
        SND.alarm();
        SND.setMood('boss');
      }
      break;
    }
    case 'warn':
      if(--d.phaseT <= 0){
        d.phase = 'boss';
        spawnBoss(S.boss);
        BG.boost = 1.4;
      }
      break;
    case 'boss':
      break;
    case 'clear':
      if(--d.phaseT <= 0){
        if(d.stage >= STAGES.length - 1) victory();
        else startStage(d.stage + 1);
      }
      break;
  }
}
