   16. COLLISIONS
   --------------------------------------------------------------- */
function damageFoe(e, dmg, x, y){
  e.hp -= dmg;
  e.hitT = 4;
  if(Math.random() < 0.5) coneSpark(x, y, 2, -Math.PI/2 + rnd(-1,1), 0.8, '#ffffff', 2.5, 8);
  if(e.hp <= 0) killFoe(e);
}

function damageBoss(dmg, x, y){
  const b = boss;
  if(!b || b.dead || b.invul || b.entering) return;
  b.hp -= dmg;
  b.hitT = 2;
  if(Math.random() < 0.35) coneSpark(x, y, 2, -Math.PI/2, 1, '#ffffff', 2.6, 9);
  if(b.hp <= 0){ b.hp = 0; killBoss(); }
  else bossCheckPhase();
}

function inEllipse(x, y, cx, cy, rx, ry){
  const dx = (x - cx) / rx, dy = (y - cy) / ry;
  return dx * dx + dy * dy <= 1;
}

function collisions(){
  const p = player;

  /* --- tirs du joueur --- */
  for(let i = pb.length - 1; i >= 0; i--){
    const b = pb[i];
    let gone = false;

    if(boss && !boss.dead && !boss.gone){
      for(const pod of boss.pods){
        if(pod.dead) continue;
        const px = boss.x + pod.ox, py = boss.y + pod.oy;
        if(dist2(b.x, b.y, px, py) < (20 + b.r) * (20 + b.r)){
          pod.hp -= b.dmg; pod.hitT = 4;
          SND.hit();
          coneSpark(b.x, b.y, 2, -Math.PI/2, 1, '#ffd08a', 2.4, 8);
          if(pod.hp <= 0){
            pod.dead = 1;
            explode(px, py, 1.6, '#ffd08a');
            addScore(3000, 1);
            spawnDrop(px, py, 'energy');
          }
          gone = true;
        }
      }
      if(!gone && !boss.entering && !boss.invul &&
         inEllipse(b.x, b.y, boss.x, boss.y, boss.rx + b.r, boss.ry + b.r)){
        damageBoss(b.dmg, b.x, b.y);
        SND.hit();
        if(b.splash) splashDamage(b.x, b.y, b.splash, b.dmg * 0.5, boss);
        if(b.pierce > 0 && b.hitIds){
          if(b.hitIds.indexOf(-1) < 0){ b.hitIds.push(-1); b.pierce--; }
          if(b.pierce <= 0) gone = true;
        } else gone = true;
      }
    }

    if(!gone){
      for(let j = foes.length - 1; j >= 0; j--){
        const e = foes[j];
        if(e.dead) continue;
        if(inEllipse(b.x, b.y, e.x, e.y, e.rx + b.r, e.ry + b.r)){
          if(b.hitIds){
            if(b.hitIds.indexOf(e.id) >= 0) continue;
            b.hitIds.push(e.id);
            b.pierce--;
          }
          damageFoe(e, b.dmg, b.x, b.y);
          SND.hit();
          if(b.splash) splashDamage(b.x, b.y, b.splash, b.dmg * 0.55, e);
          if(!b.hitIds || b.pierce <= 0){ gone = true; break; }
        }
      }
    }
    if(gone){
      if(b.type === 'plasma'){
        shockwave(b.x, b.y, b.splash || 30, b.c, 3, 16);
        spark(b.x, b.y, 8, b.c, 3, 16, 2);
      }
      pb.splice(i, 1);
    }
  }

  if(p.dead) return;

  /* --- projectiles ennemis vs joueur --- */
  if(p.invul <= 0){
    for(let i = eb.length - 1; i >= 0; i--){
      const b = eb[i];
      const rr = p.r + b.r * 0.8;
      if(dist2(b.x, b.y, p.x, p.y) < rr * rr){
        eb.splice(i, 1);
        hurtPlayer(b.dmg, b.x, b.y);
        break;
      }
    }
  }

  /* --- collision physique --- */
  for(let j = foes.length - 1; j >= 0; j--){
    const e = foes[j];
    if(e.dead) continue;
    if(inEllipse(p.x, p.y, e.x, e.y, e.rx * 0.85 + p.r, e.ry * 0.85 + p.r)){
      if(p.invul <= 0) hurtPlayer(e.big ? 34 : 26, p.x, p.y);
      if(!e.big){ damageFoe(e, 90, e.x, e.y); }
      break;
    }
  }
  if(boss && !boss.dead && !boss.gone && !boss.entering && p.invul <= 0){
    if(inEllipse(p.x, p.y, boss.x, boss.y, boss.rx * 0.9 + p.r, boss.ry * 0.9 + p.r))
      hurtPlayer(30, p.x, p.y);
  }
}

function splashDamage(x, y, radius, dmg, skip){
  const r2 = radius * radius;
  for(let j = foes.length - 1; j >= 0; j--){
    const e = foes[j];
    if(e === skip || e.dead) continue;
    if(dist2(x, y, e.x, e.y) < r2) damageFoe(e, dmg, e.x, e.y);
  }
}

/* --- l'OVERDRIVE fait des dégâts pendant sa durée --- */
let bombFx = 0;
function updateBomb(){
  if(bombFx <= 0) return;
  bombFx--;
  const p = player;
  const radius = (1 - bombFx / 90) * VW * 1.3;
  clearBulletsAround(p.x, p.y, radius);
  if(bombFx % 4 === 0){
    for(let j = foes.length - 1; j >= 0; j--){
      const e = foes[j];
      if(dist2(p.x, p.y, e.x, e.y) < radius * radius) damageFoe(e, 26, e.x, e.y);
    }
    if(boss && !boss.dead && !boss.entering && !boss.invul &&
       dist2(p.x, p.y, boss.x, boss.y) < radius * radius) damageBoss(30, boss.x, boss.y);
  }
  if(bombFx % 6 === 0) spark(player.x, player.y, 10, '#bff4ff', 9, 30, 2.6);
}

  txtWide('/ /  O V E R D R I V E  / /', VW/2, ty + 38, 15, '#ff2cf0', 2, 14);

  /* ligne de balayage */
  const sy = (gameFrame * 1.6) % (VH + 200) - 100;
  ctx.fillStyle = 'rgba(140,220,255,0.05)';
  ctx.fillRect(0, sy, VW, 60);

  panel(VH * 0.42, 216, '#2b6bff');
  const rows = [
    ['DÉPLACEMENT', 'ZQSD / WASD / FLÈCHES / SOURIS'],
    ['TIR', 'AUTO — ESPACE pour forcer'],
    ['FOCUS (précision)', 'MAJ — ralentit, révèle la hitbox'],
    ['OVERDRIVE', 'B — jauge pleine : rase l\'écran'],
    ['FRÔLER LES TIRS', 'remplit la jauge + points'],
    ['PAUSE / SON', 'P — M — F plein écran']
  ];
  rows.forEach((r, i) => {
    const y = VH * 0.42 + 30 + i * 30;
    txt(r[0], 34, y, 12, '#7fd8ff', 'left', 'bold');
    txt(r[1], VW - 34, y, 11, '#c8d6f5', 'right', 'normal');
  });

  const pulse = 0.5 + Math.sin(gameFrame * 0.09) * 0.5;
  txtWide(touchMode ? 'TOUCHEZ POUR LANCER' : 'ESPACE / CLIC POUR LANCER', VW/2, VH * 0.70,
          17, 'rgba(255,235,120,' + (0.45 + pulse * 0.55).toFixed(2) + ')', 3, 14);

  txt('MEILLEUR SCORE  ' + pad(hiScore, 8), VW/2, VH * 0.755, 13, '#ffd54a', 'center', 'bold', 6);
  txt('5 SECTEURS — 5 BOSS — AUCUNE PITIÉ', VW/2, VH * 0.94, 10, '#6f86c8', 'center', 'bold');
}

function drawGameOver(){
  ctx.fillStyle = 'rgba(20,0,8,0.72)';
  ctx.fillRect(0, 0, VW, VH);
  const pulse = 0.5 + Math.sin(gameFrame * 0.08) * 0.5;
  glow(VW/2, VH * 0.3, 200, '#ff2a4a', 0.35);
  txtWide('GAME OVER', VW/2, VH * 0.3, 40, '#ff4d6d', 6, 22);
  txt('SECTEUR ' + pad(dirState.stage + 1, 2) + ' — ' + STAGES[dirState.stage].sub,
      VW/2, VH * 0.38, 12, '#ff9db0', 'center', 'bold');

  panel(VH * 0.46, 176, '#ff4d6d');
  const st = [
    ['SCORE', pad(score, 8)],
    ['MEILLEUR', pad(hiScore, 8)],
    ['ENNEMIS DÉTRUITS', String(stats.kills)],
    ['BOSS ABATTUS', String(stats.bosses)],
    ['FRÔLEMENTS', String(stats.graze)]
  ];
  st.forEach((r, i) => {
    const y = VH * 0.46 + 28 + i * 28;
    txt(r[0], 36, y, 11, '#8fa5d8', 'left', 'bold');
    txt(r[1], VW - 36, y, 14, '#ffffff', 'right', 'bold');
  });
  if(score >= hiScore && score > 0)
    txt('★ NOUVEAU RECORD ★', VW/2, VH * 0.70, 15, 'rgba(255,213,74,' + (0.5 + pulse * 0.5).toFixed(2) + ')', 'center', 'bold', 10);
  txtWide('CLIC / ESPACE POUR REJOUER', VW/2, VH * 0.79, 14, 'rgba(255,255,255,' + (0.4 + pulse * 0.6).toFixed(2) + ')', 3, 10);
}

function rankOf(){
  if(score > 800000) return ['S', '#ffd54a'];
  if(score > 600000) return ['A', '#3dff9e'];
  if(score > 420000) return ['B', '#7fd8ff'];
  if(score > 250000) return ['C', '#c9a0ff'];
  return ['D', '#ff8b5e'];
}

function drawVictory(){
  ctx.fillStyle = 'rgba(2,10,20,0.72)';
  ctx.fillRect(0, 0, VW, VH);
  const pulse = 0.5 + Math.sin(gameFrame * 0.08) * 0.5;
  glow(VW/2, VH * 0.26, 240, '#3dff9e', 0.32);
  txtWide('MISSION ACCOMPLIE', VW/2, VH * 0.24, 26, '#3dff9e', 4, 20);
  txt('LE VIDE EST SILENCIEUX. POUR L\'INSTANT.', VW/2, VH * 0.30, 11, '#9fe8c8', 'center', 'bold');

  const R = rankOf();
  glow(VW/2, VH * 0.42, 120, R[1], 0.4);
  ctx.save();
  ctx.font = 'bold 86px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = R[1]; ctx.shadowBlur = 30;
  ctx.fillStyle = R[1];
  ctx.fillText(R[0], VW/2, VH * 0.42);
  ctx.restore();
  txt('RANG', VW/2, VH * 0.49, 11, '#8fa5d8', 'center', 'bold');

  panel(VH * 0.54, 172, '#3dff9e');
  const st = [
    ['SCORE FINAL', pad(score, 8)],
    ['BOSS ABATTUS', stats.bosses + '/' + BOSSES.length],
    ['ENNEMIS DÉTRUITS', String(stats.kills)],
    ['VAISSEAUX PERDUS', String(stats.deaths)],
    ['FRÔLEMENTS', String(stats.graze)]
  ];
  st.forEach((r, i) => {
    const y = VH * 0.54 + 30 + i * 28;
    txt(r[0], 36, y, 11, '#8fa5d8', 'left', 'bold');
    txt(r[1], VW - 36, y, 14, '#ffffff', 'right', 'bold');
  });
  txtWide('CLIC / ESPACE POUR REJOUER', VW/2, VH * 0.78, 14, 'rgba(255,255,255,' + (0.4 + pulse * 0.6).toFixed(2) + ')', 3, 10);
}

function drawPause(){
  ctx.fillStyle = 'rgba(4,6,20,0.78)';
  ctx.fillRect(0, 0, VW, VH);
  txtWide('PAUSE', VW/2, VH * 0.42, 34, '#7fd8ff', 8, 18);
  txt('P / ÉCHAP pour reprendre', VW/2, VH * 0.5, 13, '#c8d6f5', 'center', 'bold');
  txt('M : son   ·   H : tir auto   ·   F : plein écran', VW/2, VH * 0.55, 11, '#6f86c8', 'center', 'bold');
}

/* ---------------------------------------------------------------
   18. BOUCLE DE JEU
   --------------------------------------------------------------- */
let state = 'menu', paused = false, gameFrame = 0, screenLock = 0;

function togglePause(force){
  if(state !== 'play') return;
  paused = force === true ? true : !paused;
  if(paused) SND.ui();
  if(SND.musicBus) SND.musicBus.gain.value = paused ? 0.12 : 0.34;
}

function startGame(){
  score = 0; combo = 0; mult = 1; comboT = 0;
  stats.kills = 0; stats.deaths = 0; stats.graze = 0; stats.bosses = 0; stats.frames = 0;
  player = makePlayer();
  pb = []; eb = []; foes = []; drops = []; beams = []; timers = [];
  parts = []; waves = []; floats = [];
  boss = null; bossActive = false; bombFx = 0;
  nextExtend = 250000;
  paused = false;
  state = 'play';
  screenLock = 30;
  startStage(0);
  SND.unlock();
  SND.setMood('stage');
  flash('#ffffff', 0.35);
  BG.boost = 2;
}

function gameOver(){
  if(state !== 'play') return;
  state = 'over';
  screenLock = 70;
  saveHi();
  SND.setMood('over');
  flash('#ff2a4a', 0.5);
}

function victory(){
  state = 'win';
  screenLock = 70;
  saveHi();
  SND.setMood('clear');
  for(let i = 0; i < 24; i++)
    after(i * 8, () => { explode(rnd(60, VW - 60), rnd(120, VH * 0.7), rnd(0.8, 1.8), pick(['#3dff9e','#7fd8ff','#ffd54a'])); });
}

function menuTick(){
  const p = player;
  p.invul = 999; p.dead = false; p.hp = p.maxHp;
  const t = gameFrame * 0.014;
  const tx = VW/2 + Math.sin(t * 1.7) * 150;
  const ty = VH * 0.82 + Math.cos(t * 2.3) * 30;
  p.tilt = lerp(p.tilt, clamp((tx - p.x) / 8, -1, 1), 0.15);
  p.x = lerp(p.x, tx, 0.05); p.y = lerp(p.y, ty, 0.05);
  p.optAng += 0.045;
  if(gameFrame % 6 === 0) fireWeapon();
  if(gameFrame % 84 === 0) spawnFoe(pick(['drone','weaver','mine','diver']), rnd(70, VW - 70), -40, {});
  updatePlayerBullets();
  updateFoes();
  updateEnemyBullets();
  updateDrops();
  collisions();
}

function update(){
  gameFrame++;
  BG.update();
  updateFx();
  updateTimers();

  if(state === 'menu'){
    menuTick();
  } else if(state === 'play'){
    updateDirector();
    updatePlayer();
    updatePlayerBullets();
    updateEnemyBullets();
    updateFoes();
    if(boss && !boss.gone) updateBoss();
    updateBeams();
    updateDrops();
    updateBomb();
    collisions();
    updateCombo();
    stats.frames++;
  } else {
    updatePlayerBullets();
    updateEnemyBullets();
    updateFoes();
    updateDrops();
  }

  shakeMag *= 0.87; if(shakeMag < 0.15) shakeMag = 0;
  flashA *= 0.86;   if(flashA < 0.01) flashA = 0;
  chroma *= 0.93;   if(chroma < 0.01) chroma = 0;
  if(toastLife > 0) toastLife--;
  if(SND.grazeCd > 0) SND.grazeCd--;
  if(screenLock > 0) screenLock--;

  if(confirmReq){
    confirmReq = false;
    if(screenLock <= 0){
      if(state === 'menu' || state === 'over' || state === 'win') startGame();
    }
  }
  bombReq = false;
}

function drawScene(){
  BG.draw();
  drawParts(false);
  drawDrops();
  drawEnemyBullets();
  drawFoes();
  if(boss && !boss.gone) drawBoss();
  drawPlayerBullets();
  drawBeams();
  drawPlayer();
  drawWaves();
  drawParts(true);
  drawFloats();

  if(state === 'play'){
    drawHUD();
    if(dirState.phase === 'brief') drawBrief();
    else if(dirState.phase === 'warn') drawWarn();
    else if(dirState.phase === 'clear') drawClear();
    if(paused) drawPause();
  } else if(state === 'menu') drawMenu();
  else if(state === 'over') drawGameOver();
  else if(state === 'win') drawVictory();
}

/* --- post-traitement : bloom, secousse, flash, CRT --- */
const bloom = document.createElement('canvas');
const bctx = bloom.getContext('2d');
let bloomOn = true, scan = null, vign = null, vignRed = null, slowFrames = 0;

function buildOverlays(){
  const t = document.createElement('canvas');
  t.width = 4; t.height = 4;
  const g = t.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.16)';
  g.fillRect(0, 0, 4, 2);
  scan = vctx.createPattern(t, 'repeat');
  vign = vctx.createRadialGradient(VW/2, VH/2, VH * 0.34, VW/2, VH/2, VH * 0.78);
  vign.addColorStop(0, 'rgba(0,0,0,0)');
  vign.addColorStop(1, 'rgba(0,0,0,0.55)');
  vignRed = vctx.createRadialGradient(VW/2, VH/2, VH * 0.20, VW/2, VH/2, VH * 0.72);
  vignRed.addColorStop(0, 'rgba(255,20,60,0)');
  vignRed.addColorStop(1, 'rgba(255,20,60,0.85)');
}

function render(){
  drawScene();

  const sx = shakeMag ? rnd(-shakeMag, shakeMag) : 0;
  const sy = shakeMag ? rnd(-shakeMag, shakeMag) : 0;

  vctx.globalCompositeOperation = 'source-over';
  vctx.globalAlpha = 1;
  vctx.fillStyle = '#000';
  vctx.fillRect(0, 0, VW, VH);
  vctx.drawImage(scene, sx, sy, VW, VH);

  if(chroma > 0.02){
    vctx.globalCompositeOperation = 'lighter';
    vctx.globalAlpha = chroma * 0.4;
    vctx.drawImage(scene, sx - 4 * chroma, sy, VW, VH);
    vctx.drawImage(scene, sx + 4 * chroma, sy, VW, VH);
    vctx.globalAlpha = 1;
    vctx.globalCompositeOperation = 'source-over';
  }

  if(bloomOn){
    const bw = bloom.width, bh = bloom.height;
    bctx.globalCompositeOperation = 'source-over';
    bctx.clearRect(0, 0, bw, bh);
    if(bctx.filter !== undefined) bctx.filter = 'blur(2px)';
    bctx.drawImage(scene, 0, 0, bw, bh);
    if(bctx.filter !== undefined) bctx.filter = 'none';
    vctx.globalCompositeOperation = 'lighter';
    vctx.globalAlpha = 0.42;
    vctx.drawImage(bloom, sx, sy, VW, VH);
    vctx.globalAlpha = 1;
    vctx.globalCompositeOperation = 'source-over';
  }

  if(flashA > 0.01){
    vctx.globalCompositeOperation = 'lighter';
    vctx.fillStyle = rgba(flashCol, clamp(flashA, 0, 1));
    vctx.fillRect(0, 0, VW, VH);
    vctx.globalCompositeOperation = 'source-over';
  }

  if(!scan) buildOverlays();
  vctx.fillStyle = scan;
  vctx.fillRect(0, 0, VW, VH);
  vctx.fillStyle = vign;
  vctx.fillRect(0, 0, VW, VH);

  /* alerte visuelle : coque critique */
  if(state === 'play' && !paused && player && !player.dead){
    const f = player.hp / player.maxHp;
    if(f < 0.34){
      vctx.globalAlpha = clamp((1 - f / 0.34) * (0.30 + Math.sin(gameFrame * 0.16) * 0.14), 0, 0.55);
      vctx.fillStyle = vignRed;
      vctx.fillRect(0, 0, VW, VH);
      vctx.globalAlpha = 1;
    }
  }
}

let last = 0, acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  if(!last) last = now;
  let dt = now - last;
  last = now;
  if(dt > 220) dt = 220;
  acc += dt;

  /* adaptation : on coupe le bloom si ça rame */
  if(dt > 26) slowFrames++; else slowFrames = Math.max(0, slowFrames - 1);
  if(slowFrames > 90 && bloomOn){ bloomOn = false; slowFrames = 0; }

  let steps = 0;
  while(acc >= STEP && steps < 5){
    acc -= STEP;
    steps++;
    if(hitStop > 0){ hitStop--; continue; }
    if(timeScaleT > 0 && --timeScaleT <= 0) timeScale = 1;
    scaleAcc += timeScale;
    let inner = 0;
    while(scaleAcc >= 1 && inner < 4){ scaleAcc -= 1; inner++; if(!paused) update(); else pausedTick(); }
  }
  render();
}

function pausedTick(){
  gameFrame++;
  if(confirmReq) confirmReq = false;
  bombReq = false;
}

/* ---------------------------------------------------------------
   19. DÉMARRAGE
   --------------------------------------------------------------- */
function boot(){
  loadHi();
  bloom.width = Math.round(VW / 4);
  bloom.height = Math.round(VH / 4);
  player = makePlayer();
  BG.init();
  state = 'menu';
  requestAnimationFrame(frame);
}
boot();
